<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="./shared/checker-runner.js"></script>
    <style>
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: #374151;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .hidden {
            display: none;
        }

        .toast-wrapper {
            position: fixed;
            z-index: 100;
            padding: 1rem;
            width: 100%;
            max-width: 24rem;
            pointer-events: none;
        }

        .toast-wrapper>div {
            pointer-events: auto;
        }

        .top-right {
            top: 0;
            right: 0;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-out-down {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }

        .animate-fade-out-down {
            animation: fade-out-down 0.5s ease-in forwards;
        }

        .blackout {
            color: #4a5568 !important;
            background-color: #4a5568 !important;
            border-radius: 4px;
            user-select: none;
        }

        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #111827; /* gray-900 */
            min-width: 256px;
            max-width: 256px;
        }
        .sticky-col-2 {
            position: sticky;
            left: 256px;
            z-index: 20;
            background-color: #111827;
            min-width: 80px;
            max-width: 80px;
            box-shadow: 4px 0 6px -2px rgba(0, 0, 0, 0.5);
            border-right: 1px solid #374151; /* gray-700 */
        }
        /* Hover state for sticky rows */
        tr:hover .sticky-col-1, tr:hover .sticky-col-2 {
            background-color: #374151; /* gray-700 */
        }

        /* ===== COMPACT MODE STYLES ===== */
        body.compact-mode .sticky-col-1 {
            min-width: 180px;
            max-width: 180px;
        }
        body.compact-mode .sticky-col-2 {
            left: 180px;
            min-width: 60px;
            max-width: 60px;
        }
        body.compact-mode .container {
            padding: 0.5rem;
        }
        body.compact-mode table th,
        body.compact-mode table td {
            padding: 0.25rem 0.25rem !important;
        }
        body.compact-mode th[class*="text-"] {
            font-size: 0.65rem !important;
        }
        body.compact-mode td {
            font-size: 0.75rem !important;
        }
        body.compact-mode .min-w-\[80px\] {
            min-width: 50px !important;
        }
        body.compact-mode #dashboardTitle {
            font-size: 1.5rem !important;
        }
        body.compact-mode .mb-6 {
            margin-bottom: 0.75rem !important;
        }
        body.compact-mode .mb-4 {
            margin-bottom: 0.5rem !important;
        }
        body.compact-mode .p-4 {
            padding: 0.5rem !important;
        }
        body.compact-mode .gap-x-6 {
            column-gap: 1rem !important;
        }
        body.compact-mode .text-3xl {
            font-size: 1.5rem !important;
        }
        body.compact-mode .font-bold {
            font-weight: 600;
        }

        /* ===== FULL WIDTH MODE ===== */
        body.full-width-mode .container {
            max-width: 100% !important;
            margin: 0 !important;
            padding: 1rem !important;
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans">

    <div id="toast-wrapper-top-right" class="toast-wrapper top-right space-y-3"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBnw3xU5aOSExv6dx7Kr-k2pvCXzn_1UyY",
            authDomain: "mrlynch-slides-app.firebaseapp.com",
            projectId: "mrlynch-slides-app",
            storageBucket: "mrlynch-slides-app.appspot.com",
            messagingSenderId: "223179627035",
            appId: "1:223179627035:web:ff0f538f3029d829c3f6be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let assignmentData = null;
        let allStudentData = [];
        let activeClass = null;
        let assignmentId;
        let classAverages = {};
        let initialized = false; // <---- PATCH for default class selection

        // Display & Sort State
        let hideNames = false;
        let showScores = false;
        let blackoutMode = false;
        let showBehavior = false;
        let showAttempts = false;
        let sortMode = 'lastName';
        let staticRandomOrder = [];
        let showAllAttempts = localStorage.getItem('dashboardShowAllAttempts') === 'true';
        let showTierIndicators = localStorage.getItem('dashboardShowTierIndicators') === 'true';
        let currentModalView = null;
        let fullWidthMode = localStorage.getItem('dashboardFullWidth') === 'true';
        let compactMode = localStorage.getItem('dashboardCompact') === 'true';

        let auraByStudent = new Map();
        let submittedStatusByStudent = new Map();
        let submittedEmails = new Set();
        let questionProgressByStudent = new Map(); // Key: studentEmail, Value: Map of slideIndex -> progressData
        let simDataByStudent = new Map();
        let studentsMap = new Map();
        let submissionsByStudent = new Map();
        let violationsByStudent = new Map();
        let simDataByStudentLocal = new Map();

        // --- Impersonation Logic ---
        function checkImpersonation() {
            const impersonatedEmail = localStorage.getItem('impersonatedUserEmail');
            if (impersonatedEmail) {
                const banner = document.createElement('div');
                banner.className = 'bg-red-600 text-white text-center p-2 font-bold fixed top-0 w-full z-[200] flex justify-center items-center gap-4';
                banner.innerHTML = `<span>⚠️ IMPERSONATING: ${impersonatedEmail}</span><button onclick="stopImpersonating()" class="bg-white text-red-600 px-3 py-1 rounded text-xs hover:bg-gray-200">Stop</button>`;
                document.body.prepend(banner);
                document.body.style.paddingTop = '40px';
                return impersonatedEmail;
            }
            return null;
        }
        function stopImpersonating() {
            localStorage.removeItem('impersonatedUserEmail');
            window.location.reload();
        }
        // ---------------------------

        let currentUserEmail = null;

        // --- Firestore live listener handles ---
        let unsubscribeStudents = null;
        let unsubscribeArray = []; // Tracks all sub-assignment listeners
        let unsubscribeStatus = null; // Still used for some legacy checks if any

        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            assignmentId = urlParams.get('assignmentId');
            if (!assignmentId) {
                document.getElementById('loadingError').textContent = "Error: No assignment ID provided in the URL.";
                return;
            }
            auth.onAuthStateChanged(async user => {
                if (user) {
                    try {
                        let emailToCheck = user.email.toLowerCase();
                        const impersonated = checkImpersonation();
                        if (impersonated) emailToCheck = impersonated;
                        currentUserEmail = emailToCheck;

                        // 1. Check if user is an explicit teacher
                        const teacherDoc = await db.collection("teachers").doc(emailToCheck).get();
                        let isAuthorized = teacherDoc.exists;

                        // 2. If not explicit, check if they are an implicit co-teacher
                        if (!isAuthorized) {
                            const implicitQuery = await db.collection("teachers").where("coTeachingFor", "array-contains", emailToCheck).get();
                            if (!implicitQuery.empty) {
                                isAuthorized = true;
                            }
                        }

                        if (isAuthorized) {
                            loadDashboard();
                        } else {
                            document.getElementById('pageLoader').classList.add('hidden');
                            document.getElementById('loadingError').textContent = `Access Denied: You (${emailToCheck}) are not authorized as a teacher.`;
                            // No signOut, allow stop impersonation
                        }
                    } catch (error) {
                        console.error("Error checking teacher authorization:", error);
                        document.getElementById('pageLoader').classList.add('hidden');
                        document.getElementById('loadingError').textContent = "An error occurred during authentication.";
                    }
                } else {
                    document.getElementById('pageLoader').classList.add('hidden');
                    document.getElementById('loginContainer').classList.remove('hidden');
                }
            });
        };
                // --- SETUP LIVE LISTENERS (OPTIMIZED) ---
        let displayUpdateTimeout = null;
        function debouncedDisplayUpdate() {
            if (displayUpdateTimeout) clearTimeout(displayUpdateTimeout);
            displayUpdateTimeout = setTimeout(() => {
                calculateAllClassAverages();
                populateClassLinks();
                displayStudentData();
            }, 100);
        }

        function chunkArray(myArray, chunk_size) {
            let index = 0;
            let arrayLength = myArray.length;
            let tempArray = [];
            for (index = 0; index < arrayLength; index += chunk_size) {
                tempArray.push(myArray.slice(index, index + chunk_size));
            }
            return tempArray;
        }

        function setupLiveStudentData() {
            cleanupListeners();

            // Listener 1: Roster Data (Independent of assignmentId)
            unsubscribeStudents = db.collection("students")
                .onSnapshot(studentSnapshot => {
                    const assignmentTeacher = assignmentData.teacherEmail ? assignmentData.teacherEmail.toLowerCase() : 'klynch@mtps.us';

                    studentSnapshot.docChanges().forEach(change => {
                        const studentData = change.doc.data();
                        const studentTeacher = studentData.teacherEmail ? studentData.teacherEmail.toLowerCase() : 'klynch@mtps.us';
                        const studentEmail = studentData.email ? studentData.email.toLowerCase() : '';

                        if (change.type === "added" || change.type === "modified") {
                            if (studentTeacher === assignmentTeacher && studentEmail) {
                                studentsMap.set(studentEmail, { ...studentData, email: studentEmail });
                            } else if (studentEmail) {
                                studentsMap.delete(studentEmail);
                            }
                        } else if (change.type === "removed" && studentEmail) {
                            studentsMap.delete(studentEmail);
                        }
                    });
                    rebuildAllStudentData();
                });

            // For collections tied to assignment IDs, determine targets
            let targetIds = [assignmentId];
            if (assignmentData.type === 'lesson' && assignmentData.sections && assignmentData.sections.length > 0) {
                const linkedIds = assignmentData.sections.map(s => s.linkedAssignmentId).filter(id => id);
                targetIds = [...new Set([assignmentId, ...linkedIds])]; // Unique IDs
            }

            const chunks = chunkArray(targetIds, 10);

            chunks.forEach(chunk => {
                // Listener 2: Submissions
                const unSub = db.collection("submissions")
                    .where("assignmentId", "in", chunk)
                    .onSnapshot(submissionSnapshot => {
                        submissionSnapshot.docChanges().forEach(change => {
                            const submission = { id: change.doc.id, ...change.doc.data() };
                            const studentEmail = submission.studentEmail ? submission.studentEmail.toLowerCase() : '';
                            if (!studentEmail) return;

                            if (change.type === "removed") {
                                const submissions = submissionsByStudent.get(studentEmail) || [];
                                submissionsByStudent.set(
                                    studentEmail,
                                    submissions.filter(s => s.id !== submission.id)
                                );
                            } else {
                                if (!submissionsByStudent.has(studentEmail)) {
                                    submissionsByStudent.set(studentEmail, []);
                                }
                                const submissions = submissionsByStudent.get(studentEmail);
                                const existingIndex = submissions.findIndex(s => s.id === submission.id);
                                if (existingIndex >= 0) {
                                    submissions[existingIndex] = submission;
                                } else {
                                    submissions.push(submission);
                                }
                            }
                        });
                        rebuildAllStudentData();
                    });
                unsubscribeArray.push(unSub);

                // Listener 3: Submission status
                const unStatus = db.collection("submissionStatus")
                    .where("assignmentId", "in", chunk)
                    .onSnapshot(statusSnapshot => {
                        statusSnapshot.docChanges().forEach(change => {
                            const doc = change.doc;
                            const data = doc.data();
                            const email = data.studentEmail ? data.studentEmail.toLowerCase() : '';
                            if (!email) return;
                            
                            const statusKey = `${data.assignmentId}_${email}`;

                            if (change.type === "removed") {
                                if (data.assignmentId === assignmentId) {
                                    submittedEmails.delete(email);
                                    auraByStudent.delete(email);
                                }
                                submittedStatusByStudent.delete(statusKey);
                            } else {
                                if (data.assignmentId === assignmentId) {
                                    if (data.status === 'submitted') {
                                        submittedEmails.add(email);
                                    } else {
                                        submittedEmails.delete(email);
                                    }
                                    
                                    auraByStudent.set(email, {
                                        auraAwarded: !!data.auraAwarded,
                                        auraAmount: typeof data.auraAmount === 'number' ? data.auraAmount : 0
                                    });
                                }
                                
                                submittedStatusByStudent.set(statusKey, {
                                    assignmentId: data.assignmentId,
                                    status: data.status || 'none',
                                    score: typeof data.score === 'number' ? data.score : 0,
                                    watchTime: data.watchTimeSeconds || data.watchTime || 0,
                                    furthestReachedTime: data.furthestReachedTime || 0,
                                    videoDuration: data.videoDuration || 0
                                });
                            }
                        });
                        rebuildAllStudentData();
                    });
                unsubscribeArray.push(unStatus);

                // Listener 3.5: Main Assignment Live Config (New)
                if (assignmentId) {
                    const unMain = db.collection("assignments").doc(assignmentId)
                        .onSnapshot(snap => {
                            if (snap.exists) {
                                const newData = snap.data();
                                assignmentData = { ...assignmentData, ...newData };
                                if (assignmentData.type === 'lesson') renderLessonControlPanel();
                                rebuildAllStudentData();
                            }
                        });
                    unsubscribeArray.push(unMain);
                }

                // Listener 4: Focus violations
                const unVio = db.collection("focusViolations")
                    .where("assignmentId", "in", chunk)
                    .onSnapshot(violationSnapshot => {
                        violationSnapshot.docChanges().forEach(change => {
                            const violation = { id: change.doc.id, ...change.doc.data() };
                            const studentEmail = violation.studentEmail ? violation.studentEmail.toLowerCase() : '';
                            if (!studentEmail) return;

                            if (change.type === "removed") {
                                const violations = violationsByStudent.get(studentEmail) || [];
                                violationsByStudent.set(studentEmail, violations.filter(v => v.id !== violation.id));
                            } else {
                                if (!violationsByStudent.has(studentEmail)) {
                                    violationsByStudent.set(studentEmail, []);
                                }
                                const violations = violationsByStudent.get(studentEmail);
                                const existingIndex = violations.findIndex(v => v.id === violation.id);
                                if (existingIndex >= 0) {
                                    violations[existingIndex] = violation;
                                } else {
                                    violations.push(violation);
                                }
                            }
                        });
                        rebuildAllStudentData();
                    });
                unsubscribeArray.push(unVio);

                // Listener 5: Question progress
                const unProg = db.collection("questionProgress")
                    .where("assignmentId", "in", chunk)
                    .onSnapshot(progressSnapshot => {
                        progressSnapshot.docChanges().forEach(change => {
                            const progress = { id: change.doc.id, ...change.doc.data() };
                            const studentEmail = progress.studentEmail ? progress.studentEmail.toLowerCase() : '';
                            if (!studentEmail) return;

                            const slideIndex = parseInt(progress.slideIndex, 10);
                            if (isNaN(slideIndex)) return;
                            
                            // Key by assignmentId + slideIndex to avoid collisions between sections
                            const progressKey = `${progress.assignmentId}_${slideIndex}`;

                            if (change.type === "removed") {
                                if (questionProgressByStudent.has(studentEmail)) {
                                    questionProgressByStudent.get(studentEmail).delete(progressKey);
                                }
                            } else {
                                if (!questionProgressByStudent.has(studentEmail)) {
                                    questionProgressByStudent.set(studentEmail, new Map());
                                }
                                questionProgressByStudent.get(studentEmail).set(progressKey, progress);
                            }
                        });
                        rebuildAllStudentData();
                    });
                unsubscribeArray.push(unProg);

                // Listener 6: Simulation Data
                const unSim = db.collection("simulationData")
                    .where("assignmentId", "in", chunk)
                    .onSnapshot(simSnapshot => {
                        simSnapshot.docChanges().forEach(change => {
                            const doc = change.doc;
                            const simDoc = doc.data();
                            const studentEmail = simDoc.studentEmail ? simDoc.studentEmail.toLowerCase() : '';
                            if (!studentEmail) return;

                            if (change.type === "removed") {
                                simDataByStudentLocal.delete(studentEmail);
                            } else {
                                simDataByStudentLocal.set(studentEmail, simDoc.simData);
                            }
                        });
                        simDataByStudent = simDataByStudentLocal;
                        rebuildAllStudentData();
                    });
                unsubscribeArray.push(unSim);
            });

            function rebuildAllStudentData() {
                allStudentData = Array.from(studentsMap.values()).map(student => {
                    const auraData = auraByStudent.get(student.email) || { auraAwarded: false, auraAmount: 0 };
                    const questionProgress = questionProgressByStudent.get(student.email) || new Map();
                    const statusData = submittedStatusByStudent.get(`${assignmentId}_${student.email}`) || { status: 'none', watchTime: 0 };
                    
                    // Lesson-specific section mapping
                    const sectionSubmissions = {};
                    if (assignmentData.type === 'lesson' && assignmentData.sections) {
                        assignmentData.sections.forEach(sec => {
                            const key = `${sec.linkedAssignmentId}_${student.email}`;
                            if (submittedStatusByStudent.has(key)) {
                                sectionSubmissions[sec.id] = submittedStatusByStudent.get(key);
                            }
                        });
                    }

                    return {
                        ...student,
                        auraLifetime: student.auraLifetime || 0,
                        submissions: submissionsByStudent.get(student.email) || [],
                        isSubmitted: submittedEmails.has(student.email),
                        violations: violationsByStudent.get(student.email) || [],
                        auraAwarded: auraData.auraAwarded,
                        auraAmount: auraData.auraAmount,
                        watchTime: statusData.watchTime || 0,
                        furthestReachedTime: statusData.furthestReachedTime || 0,
                        videoDuration: statusData.videoDuration || 0,
                        questionProgress,
                        simData: simDataByStudentLocal.get(student.email) || null,
                        sectionSubmissions
                    };
                });

                const assignedClasses = assignmentData.assignedClasses || [];
                const classesInAssignment = [...new Set(allStudentData.filter(s => assignedClasses.includes(String(s.class))).map(s => String(s.class)))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
                if (!initialized && classesInAssignment.length > 0) {
                    activeClass = classesInAssignment[0];
                    initialized = true;
                }

                debouncedDisplayUpdate();
            }
        }

        async function loadDashboard() {
            try {
                // Get assignment document first
                const doc = await db.collection("assignments").doc(assignmentId).get();
                if (!doc.exists) {
                    document.getElementById('loadingError').textContent = "Error: This assignment could not be found.";
                    return;
                }
                assignmentData = { id: doc.id, ...doc.data() };
                window.auraTierConfig = null;
                try {
                    const tierDoc = await db.collection('auraTiers').doc(assignmentData.teacherEmail || currentUserEmail).get();
                    if (tierDoc.exists) window.auraTierConfig = tierDoc.data().tiers || [];
                } catch (e) { }
                // Load Linked Assignments for Lessons
                window.linkedAssignmentsData = {};
                if (assignmentData.type === 'lesson' && assignmentData.sections) {
                    const linkedIds = assignmentData.sections.map(s => s.linkedAssignmentId).filter(id => id);
                    if (linkedIds.length > 0) {
                        try {
                            const chunks = [];
                            for(let i = 0; i < linkedIds.length; i += 10) chunks.push(linkedIds.slice(i, i+10));
                            
                            for (const chunk of chunks) {
                                const q = await db.collection("assignments").where(firebase.firestore.FieldPath.documentId(), "in", chunk).get();
                                q.forEach(d => {
                                    window.linkedAssignmentsData[d.id] = { id: d.id, ...d.data() };
                                });
                            }
                        } catch(e) {
                            console.error("Error loading linked assignments:", e);
                        }
                    }
                }


                // Get current user's email and teacher profile
                const teacherDoc = await db.collection("teachers").doc(currentUserEmail).get();
                const teacherProfile = teacherDoc.exists ? teacherDoc.data() : null;

                // Check if user has permission to view this assignment
                const isOwner = assignmentData.teacherEmail === currentUserEmail;
                const isCoTeacher = (assignmentData.coTeachers || []).includes(currentUserEmail);
                const isAdmin = teacherProfile?.isAdmin === true;
                let hasAccess = isOwner || isCoTeacher || isAdmin;

                // If not explicit, check for Implicit Global Co-Teacher access
                if (!hasAccess && assignmentData.teacherEmail) {
                    const ownerDoc = await db.collection("teachers").doc(assignmentData.teacherEmail).get();
                    if (ownerDoc.exists) {
                        const ownerData = ownerDoc.data();
                        if (ownerData.coTeachingFor && Array.isArray(ownerData.coTeachingFor)) {
                            if (ownerData.coTeachingFor.map(e => e.toLowerCase()).includes(currentUserEmail)) {
                                hasAccess = true;
                            }
                        }
                    }
                }

                if (!hasAccess) {
                    document.getElementById('loadingError').textContent = "Access Denied: You do not have permission to view this assignment.";
                    return;
                }

                document.title = assignmentData.name + " - Dashboard";
                document.getElementById('dashboardTitle').textContent = `Dashboard for: ${assignmentData.name}`;

                // Apply saved modes
                if (fullWidthMode) {
                    document.getElementById('fullWidthMode').checked = true;
                    document.body.classList.add('full-width-mode');
                }
                if (compactMode) {
                    document.getElementById('compactMode').checked = true;
                    document.body.classList.add('compact-mode');
                }
                if (showTierIndicators) {
                    document.getElementById('showTierIndicators').checked = true;
                }

                setupLiveStudentData(); // <-- Live updates!
                // No activeClass set here: handled in snapshot listener above

                if (assignmentData.type === 'video') {
                    document.getElementById('watchTimeToggleContainer').classList.remove('hidden');
                }
                if (assignmentData.type === 'simulation') {
                    document.getElementById('simDataToggleContainer').classList.remove('hidden');
                }

                document.getElementById('pageLoader').classList.add('hidden');
                document.getElementById('mainContainer').classList.remove('hidden');
            } catch (error) {
                console.error("Error loading dashboard:", error);
                document.getElementById('loadingError').textContent = "An error occurred while loading the dashboard.";
            }

        function calculateAllClassAverages() {
            const averages = {};
            const assignedClasses = assignmentData.assignedClasses || [];
            const studentsInAssignment = allStudentData.filter(s => assignedClasses.includes(String(s.class)));
            
            let numQuestions = 0;
            let questionsList = [];
            if (assignmentData.type === 'lesson' && assignmentData.sections && window.linkedAssignmentsData) {
                assignmentData.sections.forEach(sec => {
                    const linkedData = window.linkedAssignmentsData[sec.linkedAssignmentId];
                    if (linkedData) {
                        const linkedNumQ = linkedData.type === 'pdf' ? (linkedData.questionZones ? linkedData.questionZones.length : 0) : linkedData.type === 'video' ? (linkedData.videoQuestions ? linkedData.videoQuestions.length : 0) : linkedData.type === 'simulation' ? (linkedData.simQuestions ? linkedData.simQuestions.length : 0) : (linkedData.slideIds ? linkedData.slideIds.length : 0);
                        for (let j = 0; j < linkedNumQ; j++) {
                            questionsList.push({ assignmentId: linkedData.id, slideIndex: j });
                        }
                    }
                });
                numQuestions = questionsList.length;
            } else {
                numQuestions = assignmentData.type === 'pdf' ? (assignmentData.questionZones ? assignmentData.questionZones.length : 0) : assignmentData.type === 'video' ? (assignmentData.videoQuestions ? assignmentData.videoQuestions.length : 0) : assignmentData.type === 'simulation' ? (assignmentData.simQuestions ? assignmentData.simQuestions.length : 0) : assignmentData.type === 'blank' ? (assignmentData.blocks || []).filter(b => b.type === 'question').length : (assignmentData.slideIds ? assignmentData.slideIds.length : 0);
            }

            const classes = [...new Set(studentsInAssignment.map(s => String(s.class)))];
            classes.forEach(c => {
                const studentsInClass = studentsInAssignment.filter(s => String(s.class) === c);
                let totalScore = 0;
                let attemptedQuestions = 0;
                studentsInClass.forEach(student => {
                    for (let i = 0; i < numQuestions; i++) {
                        let latestSubmission;
                        if (assignmentData.type === 'lesson') {
                            const q = questionsList[i];
                            latestSubmission = student.submissions.filter(sub => sub.slideIndex === q.slideIndex && sub.assignmentId === q.assignmentId).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))[0];
                        } else {
                            latestSubmission = student.submissions.filter(sub => sub.slideIndex === i).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))[0];
                        }
                        if (latestSubmission) {
                            totalScore += latestSubmission.score;
                            attemptedQuestions++;
                        }
                    }
                });
                averages[c] = attemptedQuestions > 0 ? (totalScore / attemptedQuestions).toFixed(0) : '-';
            });

            let allTotalScore = 0;
            let allAttemptedQuestions = 0;
            studentsInAssignment.forEach(student => {
                for (let i = 0; i < numQuestions; i++) {
                    let latestSubmission;
                    if (assignmentData.type === 'lesson') {
                        const q = questionsList[i];
                        latestSubmission = student.submissions.filter(sub => sub.slideIndex === q.slideIndex && sub.assignmentId === q.assignmentId).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))[0];
                    } else {
                        latestSubmission = student.submissions.filter(sub => sub.slideIndex === i).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))[0];
                    }
                    if (latestSubmission) {
                        allTotalScore += latestSubmission.score;
                        allAttemptedQuestions++;
                    }
                }
            });
            averages['All'] = allAttemptedQuestions > 0 ? (allTotalScore / allAttemptedQuestions).toFixed(0) : '-';
            classAverages = averages;
        }

        function getDashboardTierBadge(lifetimeAura) {
            const tiers = window.auraTierConfig;
            if (!tiers || tiers.length === 0) {
                if (lifetimeAura >= 300) return { emoji: '👑', label: 'Elite', color: 'text-purple-400' };
                if (lifetimeAura >= 150) return { emoji: '⭐', label: 'Scholar', color: 'text-yellow-400' };
                if (lifetimeAura >= 50) return { emoji: '🔵', label: 'Focused', color: 'text-blue-400' };
                return null;
            }
            const sorted = [...tiers].sort((a, b) => (b.threshold || 0) - (a.threshold || 0));
            const matched = sorted.find(t => lifetimeAura >= (t.threshold || 0));
            if (!matched || (matched.threshold || 0) === 0) return null;
            const colorMap = { purple: 'text-purple-400', yellow: 'text-yellow-400', blue: 'text-blue-400', gray: 'text-gray-400' };
            return { emoji: matched.emoji || '✦', label: matched.name, color: colorMap[matched.color] || 'text-gray-400' };
        }

        function getCurrentlySortedStudents(applySort = true) {
            const assignedClasses = assignmentData.assignedClasses || [];
            const studentsInAssignment = allStudentData.filter(s => assignedClasses.includes(String(s.class)));
            const filteredStudents = (activeClass === 'All' ? studentsInAssignment : studentsInAssignment.filter(s => String(s.class) === String(activeClass)));
            if (!applySort) return filteredStudents;

            let sortedStudents = [...filteredStudents];
            switch (sortMode) {
                case 'firstName': sortedStudents.sort((a, b) => a.name.localeCompare(b.name)); break;
                case 'lastName': sortedStudents.sort((a, b) => (a.name.split(' ').pop() || '').localeCompare(b.name.split(' ').pop() || '')); break;
                case 'random-live': sortedStudents.sort(() => Math.random() - 0.5); break;
                case 'random-static':
                    const currentEmails = new Set(filteredStudents.map(s => s.email));
                    sortedStudents = staticRandomOrder.filter(s => currentEmails.has(s.email));
                    break;
            }
            return sortedStudents;
        }

        // --- Grading Functions (from Version 1) ---

        function executeChecker(submission) {
            const slideIndex = submission.slideIndex;
            const dataToUse = (window.linkedAssignmentsData && window.linkedAssignmentsData[submission.assignmentId])
                ? window.linkedAssignmentsData[submission.assignmentId]
                : assignmentData;

            let checkerKey = `calc${slideIndex + 1}`;
            let questionBlock = null;

            if (dataToUse.type === 'video') {
                checkerKey = dataToUse.videoQuestions?.[slideIndex]?.id || checkerKey;
            } else if (dataToUse.type === 'simulation') {
                checkerKey = dataToUse.simQuestions?.[slideIndex]?.id || checkerKey;
            } else if (dataToUse.type === 'blank') {
                const questionBlocks = (dataToUse.blocks || []).filter(b => b.type === 'question');
                questionBlock = questionBlocks[slideIndex] || null;
                checkerKey = questionBlock?.id || checkerKey;
            }

            const funcEntry = dataToUse.checkerFunctions?.[checkerKey] ?? dataToUse.checkerFunctions?.[`calc${slideIndex + 1}`];
            const funcString = funcEntry ? (typeof funcEntry === 'object' ? funcEntry.code : funcEntry) : null;

            if (!funcString) {
                if (dataToUse.type === 'video') {
                    const videoQuestion = dataToUse.videoQuestions?.[slideIndex];
                    if (videoQuestion?.type === 'multiple-choice' && Array.isArray(videoQuestion.choices)) {
                        const selectedAnswers = String(submission.answer || '')
                            .split('||')
                            .map(a => a.trim())
                            .filter(Boolean);
                        const correctAnswers = videoQuestion.choices
                            .filter(choice => choice?.isCorrect)
                            .map(choice => String(choice.text || '').trim())
                            .filter(Boolean);

                        const selectedSet = new Set(selectedAnswers);
                        const correctSet = new Set(correctAnswers);
                        if (selectedSet.size !== correctSet.size) return 0;
                        for (const answer of selectedSet) {
                            if (!correctSet.has(answer)) return 0;
                        }
                        return 100;
                    }
                }
                if (dataToUse.type === 'blank' && questionBlock?.inlineChecker) {
                    try {
                        const matched = evaluateInlineChecker(questionBlock.inlineChecker, submission.answer);
                        const pts = questionBlock.inlineChecker.points || questionBlock.points || 100;
                        return matched ? pts : 0;
                    } catch (e) {
                        console.error(`Error evaluating inlineChecker for Q${slideIndex + 1}:`, e);
                        return 0;
                    }
                }
                return 0;
            }

            try {
                const userProfile = { name: submission.studentName, email: submission.studentEmail };
                const result = executeCheckerFunction(funcString, submission.answer, {
                    userProfile,
                    showToast: () => {}
                });
                return typeof result === 'number' ? result : 0;
            } catch (e) {
                console.error(`Error executing checker function for submission ${submission.id}:`, e);
                showToast(`Error in checker for Q${slideIndex + 1}: ${e.message}`, { color: 'red' });
                return 0;
            }
        }

        async function regradeAllSubmissions() {
            if (!confirm("Are you sure you want to regrade ALL submissions for this assignment? This cannot be undone.")) return;

            const regradeBtn = document.getElementById('regradeAllButton');
            regradeBtn.disabled = true;
            regradeBtn.textContent = 'Regrading...';
            showToast("Starting to regrade all submissions...", { color: 'blue' });

            async function commitBatches(batches) {
                for (const b of batches) await b.commit();
            }

            function buildBatches(updates) {
                const LIMIT = 499;
                const batches = [];
                let current = db.batch();
                let count = 0;
                for (const { ref, data } of updates) {
                    if (count >= LIMIT) {
                        batches.push(current);
                        current = db.batch();
                        count = 0;
                    }
                    current.update(ref, data);
                    count++;
                }
                if (count > 0) batches.push(current);
                return batches;
            }

            try {
                if (assignmentData.type === 'lesson') {
                    const allSubmissions = allStudentData.flatMap(s => s.submissions);
                    if (allSubmissions.length === 0) {
                        showToast("No submissions found to regrade.", { color: 'default' });
                        return;
                    }
                    const updates = allSubmissions.map(sub => ({
                        ref: db.collection("submissions").doc(sub.id),
                        data: { score: executeChecker(sub) ?? 0, isManualGrade: false }
                    }));
                    await commitBatches(buildBatches(updates));
                    showToast(`Successfully regraded ${updates.length} submissions!`, { color: 'green' });
                    return;
                }

                const submissionsSnapshot = await db.collection("submissions")
                    .where("assignmentId", "==", assignmentId)
                    .get();

                if (submissionsSnapshot.empty) {
                    showToast("No submissions found to regrade.", { color: 'default' });
                    return;
                }

                const updates = [];
                submissionsSnapshot.forEach(doc => {
                    const submission = { id: doc.id, ...doc.data() };
                    updates.push({
                        ref: db.collection("submissions").doc(doc.id),
                        data: { score: executeChecker(submission) ?? 0, isManualGrade: false }
                    });
                });

                await commitBatches(buildBatches(updates));
                showToast(`Successfully regraded ${updates.length} submissions!`, { color: 'green' });
            } catch (error) {
                console.error("Error during regrade all:", error);
                showToast("An error occurred during regrading.", { color: 'red' });
            } finally {
                regradeBtn.disabled = false;
                regradeBtn.textContent = 'Regrade All';
                // No need to refetch, listeners will update view
            }
        }

        async function regradeQuestion(slideIndex) {
            // Check if currentModalView has targetAssignmentId
            const targetAssignmentId = (currentModalView && currentModalView.targetAssignmentId) ? currentModalView.targetAssignmentId : assignmentId;
            showToast(`Regrading Question ${slideIndex + 1}...`, { color: 'blue' });

            try {
                const submissionsSnapshot = await db.collection("submissions")
                    .where("assignmentId", "==", targetAssignmentId)
                    .where("slideIndex", "==", slideIndex)
                    .get();

                if (submissionsSnapshot.empty) {
                    showToast("No submissions found for this question.", { color: 'default' });
                    return;
                }

                const batch = db.batch();
                let count = 0;
                submissionsSnapshot.forEach(doc => {
                    const submission = { id: doc.id, ...doc.data() };
                    const newScore = executeChecker(submission) ?? 0;
                    const submissionRef = db.collection("submissions").doc(doc.id);
                    batch.update(submissionRef, { score: newScore, isManualGrade: false });

                });

                await batch.commit();
                showToast(`Successfully regraded ${count} submission(s) for Q${slideIndex + 1}!`, { color: 'green' });
            } catch (error) {
                console.error(`Error regrading question ${slideIndex + 1}:`, error);
                showToast("An error occurred during regrading.", { color: 'red' });
            } finally {
                // No need to refetch, listeners will update view
            }
        }

                    studentEmail: studentEmail,
                    studentName: student?.name || '',
                    slideIndex: slideIndex,
                    score: score,
                    maxScore: maxScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isManualGrade: true,
                    gradedBy: currentUserEmail
                }, { merge: true });
                showToast("Score saved.", { color: 'green' });

            const onlyAttempted = document.getElementById('bulkScoreOnlyAttempted').checked;
            if (isNaN(score)) {
                showToast("Please enter a valid score.", { color: 'red' });

            const targetStudents = getCurrentlySortedStudents(false);
            const attemptedEmails = new Set(
                targetStudents.flatMap(s => s.submissions
                    .filter(sub => sub.slideIndex === slideIndex && sub.assignmentId === targetAssignmentId)
                    .map(() => s.email))
            );

            const batch = db.batch();
            let updatedCount = 0;
            for (const student of targetStudents) {
                if (onlyAttempted && !attemptedEmails.has(student.email)) continue;
                const docId = `${targetAssignmentId}_${student.email}_${slideIndex}`;
                const ref = db.collection("submissions").doc(docId);
                batch.set(ref, {
                    assignmentId: targetAssignmentId,
                    studentEmail: student.email,
                    studentName: student.name,
                    slideIndex: slideIndex,
                    score: score,
                    maxScore: maxScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isManualGrade: true,
                    gradedBy: currentUserEmail
                }, { merge: true });
                updatedCount++;
            }

            if (updatedCount === 0) {
                showToast("No students matched the criteria.", { color: 'yellow' });
                return;
            }

            try {
                await batch.commit();
                showToast(`Updated scores for ${updatedCount} student${updatedCount !== 1 ? 's' : ''}.`, { color: 'green' });
            } catch (e) {
                console.error("Bulk scoring error:", e);
                showToast("Error updating scores.", { color: 'red' });
            }
        }

        async function toggleSubmissionStatus(studentEmail, isChecked) {
            const student = allStudentData.find(s => s.email === studentEmail);
            if (!student) { showToast("Could not find student data.", { color: 'red' }); return; }
            try {
                if (isChecked) {
                    await db.collection("submissionStatus").doc(`${assignmentId}_${student.email}`).set({
                        studentEmail: student.email,
                        studentName: student.name,
                        assignmentId: assignmentId,
                        status: 'submitted',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    student.isSubmitted = true;
                    showToast(`Submitted for ${student.name}.`, { color: 'green' });
                } else {
                    await db.collection("submissionStatus").doc(`${assignmentId}_${studentEmail}`).delete();
                    student.isSubmitted = false;
                    showToast(`Un-submitted for ${student.name}.`, { color: 'green' });
                }
            } catch (error) {
                console.error("Error updating submission status:", error);
                showToast("Operation failed.", { color: 'red' });
                student.isSubmitted = !isChecked;
            } finally {
                displayStudentData();

        // Bulk submission status handler
        async function handleSubmitAllCheckbox(checkbox) {
            const isChecked = checkbox.checked;
            const action = isChecked ? "mark ALL visible students as submitted" : "mark ALL visible students as NOT submitted";
            if (!confirm(`Are you sure you want to ${action}?`)) {
                // Revert the checkbox if canceled
                checkbox.checked = !isChecked;
                return;
            }

            checkbox.disabled = true;
            const students = getCurrentlySortedStudents();
            const promises = [];
            for (const student of students) {
                const alreadySubmitted = student.isSubmitted;
                if (isChecked && alreadySubmitted) continue;
                if (!isChecked && !alreadySubmitted) continue;
                promises.push(toggleSubmissionStatusBackend(student, isChecked));
            }

            if (promises.length === 0) {
                showToast('No students needed updating.', { color: 'blue' });
                checkbox.disabled = false;
                return;
            }

            try {
                await Promise.all(promises);
                showToast(`Updated ${promises.length} students.`, { color: 'green' });
            } catch (err) {
                showToast('There was an error updating students in bulk.', { color: 'red' });
                console.error(err);
                // In case of partial failure, the snapshot listener will eventually sync the local UI state
            } finally {
                checkbox.disabled = false;
                displayStudentData();
            }
        }

        // Mirrors the logic of toggleSubmissionStatus for backend update only
        async function toggleSubmissionStatusBackend(student, shouldSubmit) {
            const studentEmail = student.email.toLowerCase();
            const statusRef = db.collection("submissionStatus").doc(`${assignmentId}_${studentEmail}`);
            
            try {
                const batch = db.batch();
                
                if (shouldSubmit) {
                    batch.set(statusRef, {
                        studentEmail: student.email,
                        studentName: student.name,
                        assignmentId: assignmentId,
                        status: "submitted",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    // If this is a multimodal lesson, also submit all linked child assignments
                    if (assignmentData.type === 'lesson' && assignmentData.sections) {
                        assignmentData.sections.forEach(sec => {
                            if (sec.linkedAssignmentId) {
                                const childStatusRef = db.collection("submissionStatus").doc(`${sec.linkedAssignmentId}_${studentEmail}`);
                                batch.set(childStatusRef, {
                                    studentEmail: student.email,
                                    studentName: student.name,
                                    assignmentId: sec.linkedAssignmentId,
                                    status: "submitted",
                                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                                }, { merge: true });
                            }
                        });
                    }
                } else {
                    batch.delete(statusRef);
                    // Also delete children if it's a lesson? Generally better to be explicit, but for now let's just delete the parent.
                    // Note: Deleting children might be undesirable if the teacher just wants to reset the lesson hub status.
                }
                
                await batch.commit();
                student.isSubmitted = shouldSubmit;
            } catch (error) {
                console.error("Batch update failed:", error);
                throw error;
            }
        }

        function evaluateLockForStudent(student, section) {
            // Check Class-Level Status
            const classStatus = assignmentData.sectionStatus ? (assignmentData.sectionStatus[student.class] || {}) : {};
            if (classStatus[section.id] === 'closed') {
                return { allowed: false, reason: "Section closed by teacher." };
            }

            // Check Manual Override for this specific student
            const studentOverrides = assignmentData.studentOverrides?.[student.email] || {};
            if (studentOverrides[section.id] === 'open') return { allowed: true };

            // Check Global Override for this section
            if (assignmentData.manualOverrides?.[student.class]?.[section.id] === 'open') return { allowed: true };

            // Evaluate Conditions
            const cond = section.unlockCondition;
            if (!cond || !cond.dependsOn) return { allowed: true };

            const depSection = assignmentData.sections.find(s => s.id === cond.dependsOn);
            if (!depSection) return { allowed: true };

            const depSub = student.sectionSubmissions?.[depSection.id];
            if (!depSub) return { allowed: false, reason: `Requires completion of "${depSection.title}"` };

            const uType = cond.unlockType || (cond.requireStatus === 'submitted' ? 'submitted' : 'none');
            const isSubmitted = depSub.status === 'submitted';
            const score = typeof depSub.score === 'number' ? depSub.score : 0;
            const minScore = parseFloat(cond.minScore || 0);

            if (uType === 'score') {
                if (score < minScore) return { allowed: false, reason: `Requires ${minScore}% on "${depSection.title}"` };
            } else if (uType === 'both') {
                if (!isSubmitted) return { allowed: false, reason: `Must submit "${depSection.title}" AND have ${minScore}%.` };
                if (score < minScore) return { allowed: false, reason: `Requires ${minScore}% on "${depSection.title}"` };
            } else {
                if (!isSubmitted) return { allowed: false, reason: `Must submit "${depSection.title}"` };
                if (minScore > 0 && score < minScore) return { allowed: false, reason: `Requires ${minScore}% on "${depSection.title}"` };
            }

            if (cond.maxScore && score > parseFloat(cond.maxScore)) {
                return { allowed: false, reason: `Requires score below ${cond.maxScore}% on "${depSection.title}"` };
            }

            return { allowed: true };
        }

        function renderSimDataValue(value) {
            if (Array.isArray(value)) {
                if (value.length === 0) return '<p class="text-gray-400">[]</p>';
                if (value.every(item => item && typeof item === 'object' && !Array.isArray(item))) {
                    const keys = Array.from(new Set(value.flatMap(item => Object.keys(item))));
                    let html = '<div class="overflow-x-auto"><table class="min-w-full text-sm border border-gray-700"><thead class="bg-gray-700"><tr>';
                    keys.forEach(k => { html += `<th class="px-3 py-2 text-left border-b border-gray-600">${escapeHtml(k)}</th>`; });
                    html += '</tr></thead><tbody>';
                    value.forEach(row => {
                        html += '<tr class="border-t border-gray-700">';
                        keys.forEach(k => { html += `<td class="px-3 py-2 align-top">${renderSimDataValue(row[k])}</td>`; });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    return html;
                }
                return `<ul class="list-disc pl-5 space-y-1">${value.map(v => `<li>${renderSimDataValue(v)}</li>`).join('')}</ul>`;
            }
            if (value && typeof value === 'object') {
                const entries = Object.entries(value);
                if (!entries.length) return '<p class="text-gray-400">{}</p>';
                return `<dl class="space-y-2">${entries.map(([k, v]) => `<div class="bg-gray-700/50 rounded p-2"><dt class="font-semibold text-cyan-300">${escapeHtml(k)}</dt><dd class="mt-1">${renderSimDataValue(v)}</dd></div>`).join('')}</dl>`;
            }
            if (value === null || value === undefined) return '<span class="text-gray-500">null</span>';
            return escapeHtml(String(value));
        }

                        'window_blur': '📱 Tab Switch / Sidebar',
                        'tab_hidden': '📱 Tab Hidden',
                        'right_click': '🖱️ Right-Click Attempt',
                        'drag_drop': '🖐️ Drag & Drop Attempt',
                        'blocked_key': '⌨️ Blocked Key',
                        'blocked_shortcut': '⌨️ Blocked Shortcut'
                    };
                    const typeLabel = typeLabels[violation.violationType] || escapeHtml(violation.violationType || 'Unknown');
                    const slideNum = typeof violation.slideIndex === 'number' ? violation.slideIndex + 1 : 1;

                    contentHtml += `<div class="bg-red-900/30 border border-red-700 p-4 rounded-lg">
                    <div class="flex justify-between items-center mb-2">
                        <p class="font-bold text-lg text-red-400">${typeLabel}</p>
                        <p class="text-sm text-gray-400">${escapeHtml(date)}</p>
                    </div>
                    <p class="text-gray-300">${escapeHtml(violation.description || 'No description')}</p>
                    <p class="text-xs text-gray-500 mt-1">Slide: Q${escapeHtml(String(slideNum))}</p>
                </div>`;
                });
            } else {
                contentHtml += '<p class="text-green-400">No violations recorded for this student.</p>';
            }
            contentHtml += '</div>';
            document.getElementById('modalContent').innerHTML = contentHtml;
            document.getElementById('submissionModal').classList.remove('hidden');
        }

        function handleCredentialResponse(response) {
            auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(response.credential))
                .catch(err => console.error("Sign-in failed:", err));
        }

        // Helper function to escape HTML special characters to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function (match) {
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return escapeMap[match];
            });
        }

        function startImpersonating(email, name) {
            localStorage.setItem('impersonatedUserEmail', email.toLowerCase());
            showToast(`Now impersonating: ${name || email}`, { color: 'green' });
            
            setTimeout(() => {
                if (confirm(`🎭 Impersonation Active!\n\nWould you like to open this assignment in a new tab as ${name}?`)) {
                    window.open(`./classroompicker.html?assignmentId=${assignmentId}`, '_blank');
                }
                window.location.reload();
            }, 300);
        }

        function showToast(message, options = {}) {
            const { color = 'default', duration = 5000 } = options;
            const wrapper = document.getElementById('toast-wrapper-top-right');
            const toast = document.createElement('div');
            toast.className = 'flex items-center justify-between p-4 rounded-lg shadow-lg text-white max-w-sm w-full animate-fade-in-up';
            const colors = { default: 'bg-gray-700', green: 'bg-green-600', red: 'bg-red-600', blue: 'bg-blue-600' };
            toast.classList.add(colors[color] || colors['default']);
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-4 text-2xl font-bold">&times;</button>`;
            wrapper.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('animate-fade-in-up');
                toast.classList.add('animate-fade-out-down');
                toast.addEventListener('animationend', () => toast.remove());
            }, duration);
        }

        function copyGrades() {
            const maxPoints = parseFloat(document.getElementById('maxPoints').value) || 100;
            const decimalPlaces = parseInt(document.getElementById('decimalPlaces').value, 10) || 0;
            const studentsToExport = getCurrentlySortedStudents();
            const numQuestions = assignmentData.type === 'pdf' ? (assignmentData.questionZones ? assignmentData.questionZones.length : 0) : assignmentData.type === 'video' ? (assignmentData.videoQuestions ? assignmentData.videoQuestions.length : 0) : assignmentData.type === 'simulation' ? (assignmentData.simQuestions ? assignmentData.simQuestions.length : 0) : assignmentData.type === 'blank' ? (assignmentData.blocks || []).filter(b => b.type === 'question').length : (assignmentData.slideIds ? assignmentData.slideIds.length : 0);

            const outputData = studentsToExport.map(student => {
                const nameParts = student.name.split(' ').filter(Boolean);
                const firstName = nameParts[0] || "";
                const lastName = nameParts.slice(1).join(' ') || "";
                const formattedName = lastName ? `${lastName}, ${firstName}` : firstName;

                let totalScore = 0;
                for (let i = 0; i < numQuestions; i++) {
                    const latestSubmission = student.submissions.filter(s => s.slideIndex === i).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))[0];
                    if (latestSubmission) {
                        totalScore += latestSubmission.score;
                    }
                }
                const rawPercentage = numQuestions > 0 ? totalScore / numQuestions : 0;
                const scaledScore = ((rawPercentage / 100) * maxPoints).toFixed(decimalPlaces);

                return `${formattedName}\t${scaledScore}`;
            });

            const finalText = outputData.join('\n');
            if (finalText) {
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = finalText;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    showToast(`Copied ${outputData.length} grades to clipboard!`, { color: 'green' });
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                    showToast("Failed to copy grades.", { color: 'red' });
                }
                document.body.removeChild(tempTextArea);
            }
        }

        function exportToCSV() {
            let csvContent = "\uFEFF"; // Add BOM for Excel UTF-8 support
            const numQuestions = assignmentData.type === 'pdf' ? (assignmentData.questionZones ? assignmentData.questionZones.length : 0) : assignmentData.type === 'video' ? (assignmentData.videoQuestions ? assignmentData.videoQuestions.length : 0) : assignmentData.type === 'simulation' ? (assignmentData.simQuestions ? assignmentData.simQuestions.length : 0) : assignmentData.type === 'blank' ? (assignmentData.blocks || []).filter(b => b.type === 'question').length : (assignmentData.slideIds ? assignmentData.slideIds.length : 0);
            const hasFocusMode = assignmentData.focusModeEnabled;

            let headers = ["Email", "Last Name", "First Name", "Full Name (Last, First)", "Class", "Average Score %", "Completion %"];
            if (hasFocusMode) headers.push("Focus Violations");
            headers.push("Aura");
            for (let i = 1; i <= numQuestions; i++) { headers.push(`Q${i} Score`); }

            csvContent += headers.map(h => `"${h}"`).join(',') + "\r\n";

            const studentsToExport = getCurrentlySortedStudents();

            studentsToExport.forEach(student => {
                const nameParts = student.name.split(' ').filter(Boolean);
                const firstName = nameParts[0] || "";
                const lastName = nameParts.slice(1).join(' ') || "";
                const fullNameLF = `"${lastName}, ${firstName}"`;

                let questionScores = [];
                let totalScore = 0;
                let attemptedQuestions = 0;

                for (let i = 0; i < numQuestions; i++) {
                    const latestSubmission = student.submissions.filter(s => s.slideIndex === i).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))[0];
                    if (latestSubmission) {
                        questionScores.push(latestSubmission.score);
                        totalScore += latestSubmission.score;
                        attemptedQuestions++;
                    } else {
                        questionScores.push(0); // Unattempted count as 0
                    }
                }

                const averageScore = numQuestions > 0 ? (totalScore / numQuestions).toFixed(2) : "0.00";
                const completionPercentage = numQuestions > 0 ? ((attemptedQuestions / numQuestions) * 100).toFixed(2) : "0.00";

                let row = [
                    `"${student.email}"`,
                    `"${lastName}"`,
                    `"${firstName}"`,
                    fullNameLF, // already quoted
                    `"${student.class}"`,
                    averageScore,
                    completionPercentage
                ];

                if (hasFocusMode) {
                    row.push((student.violations || []).length);
                }
                row.push(student.auraAwarded ? student.auraAmount : 0);

                // Add individual question scores
                row = [...row, ...questionScores].join(',');
                csvContent += row + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            const safeAssignmentName = assignmentData.name.replace(/[^a-z0-9]/gi, '_');
            const safeViewName = (activeClass || 'All').replace(/\s+/g, '_');
            link.setAttribute("download", `submissions_${safeAssignmentName}_${safeViewName}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        document.getElementById('exportButton').onclick = exportToCSV;
        document.getElementById('copyGradesButton').onclick = copyGrades;
    </script>
</body>

</html>
