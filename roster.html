<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <style>
        .hidden { display: none; }
        .btn-action { transition: background-color 0.2s, transform 0.1s; }
        .btn-action:active { transform: scale(0.95); }
        @keyframes fade-in-right { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fade-out-right { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
        .animate-fade-in-right { animation: fade-in-right 0.5s ease-out forwards; }
        .animate-fade-out-right { animation: fade-out-right 0.5s ease-in forwards; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <div id="pageLoader" class="flex flex-col items-center justify-center h-screen">
        <h1 class="text-4xl font-bold text-yellow-400 mb-4">Roster Management</h1>
        <p id="loading-text" class="text-lg text-gray-300">Initializing...</p>
        <div id="signInButtonContainer" class="hidden mt-8">
             <div id="g_id_onload" data-client_id="1032478689007-9gk70vsn7i58l6f0qn5sr8q78sne1al5.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
             <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>
        <p id="auth-error" class="text-red-500 mt-4"></p>
    </div>

    <div id="rosterContent" class="hidden container mx-auto p-4 md:p-8">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <h1 class="text-3xl font-bold text-yellow-400">Class Rosters</h1>
            <div>
                <a href="./assignments.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg btn-action">&larr; All Assignments</a>
                <button onclick="openStudentModal()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg btn-action">+ Add Student</button>
                <button id="signOutButton" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg btn-action">Sign Out</button>
            </div>
        </div>
        
        <div id="loadingState" class="text-center py-10"><p class="text-xl">Loading rosters...</p></div>

        <div id="rosterContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Class roster cards will be dynamically added here -->
        </div>
    </div>

    <!-- Add/Edit Student Modal -->
    <div id="studentModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-lg">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <h2 id="modalTitle" class="text-2xl font-bold text-yellow-400">Add Student</h2>
                <button onclick="closeStudentModal()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            <div class="p-6">
                <input type="hidden" id="studentId">
                <label for="studentName" class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                <input type="text" id="studentName" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600">
                
                <label for="studentEmail" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <input type="email" id="studentEmail" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600">

                <label for="studentPasscode" class="block text-sm font-medium text-gray-300 mb-2">Passcode</label>
                <input type="text" id="studentPasscode" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600">
                
                <label for="studentClass" class="block text-sm font-medium text-gray-300 mb-2">Class</label>
                <input type="text" id="studentClass" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600">
                
                <div class="grid grid-cols-2 gap-4 mb-4 p-3 bg-gray-700/50 rounded border border-gray-600">
                    <div>
                        <label for="studentAuraLifetime" class="block text-sm font-medium text-yellow-400 mb-2">✧ Lifetime Aura</label>
                        <input type="number" id="studentAuraLifetime" value="0" min="0" step="0.1" class="w-full p-3 bg-gray-700 rounded border border-gray-600">
                    </div>
                    <div>
                        <label for="studentAuraBalance" class="block text-sm font-medium text-yellow-400 mb-2">✧ Spendable Balance</label>
                        <input type="number" id="studentAuraBalance" value="0" min="0" step="0.1" class="w-full p-3 bg-gray-700 rounded border border-gray-600">
                    </div>
                </div>
                
                <p id="modal-error" class="text-red-500 mb-4"></p>
                <button onclick="handleSaveStudent()" id="saveStudentBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg btn-action">Save Student</button>
            </div>
        </div>
    </div>

    <div id="toast-wrapper" class="fixed top-4 right-4 z-[100] space-y-3 w-full max-w-sm"></div>

    <!-- Student Performance Detail Modal -->
    <div id="student-performance-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <div>
                    <h2 id="perf-student-name" class="text-2xl font-bold text-yellow-400"></h2>
                    <p id="perf-student-email" class="text-sm text-gray-400"></p>
                    <p id="perf-student-lifetime" class="text-sm text-purple-400"></p>
                </div>
                <button onclick="closeStudentPerformance()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-3 gap-4 p-4 border-b border-gray-700">
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <p class="text-sm text-gray-400 mb-1">Average Score</p>
                    <p id="perf-avg-score" class="text-2xl font-bold text-green-400">--</p>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <p class="text-sm text-gray-400 mb-1">Assignments Completed</p>
                    <p id="perf-assignments-completed" class="text-2xl font-bold text-blue-400">--</p>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <p class="text-sm text-gray-400 mb-1">Total Aura Earned</p>
                    <p id="perf-total-aura" class="text-2xl font-bold text-yellow-400">--</p>
                </div>
            </div>
            
            <!-- Date Filter -->
            <div class="p-4 border-b border-gray-700 flex items-center gap-4">
                <label class="text-sm font-medium text-gray-300">Date Range:</label>
                <input type="date" id="perf-date-start" class="p-2 bg-gray-700 rounded border border-gray-600 text-sm">
                <span class="text-gray-400">to</span>
                <input type="date" id="perf-date-end" class="p-2 bg-gray-700 rounded border border-gray-600 text-sm">
                <button onclick="filterPerformanceByDate()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg btn-action">Filter</button>
                <button onclick="clearPerformanceFilter()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg btn-action">Clear</button>
            </div>
            
            <!-- Submissions Table -->
            <div class="flex-1 overflow-y-auto p-4">
                <table class="w-full">
                    <thead class="bg-gray-700 sticky top-0">
                        <tr>
                            <th class="text-left p-3 text-sm font-medium text-gray-300">Assignment</th>
                            <th class="text-left p-3 text-sm font-medium text-gray-300">Date</th>
                            <th class="text-left p-3 text-sm font-medium text-gray-300">Score</th>
                            <th class="text-left p-3 text-sm font-medium text-gray-300">Aura Awarded</th>
                        </tr>
                    </thead>
                    <tbody id="perf-submissions-table" class="divide-y divide-gray-700">
                        <!-- Rows populated by JavaScript -->
                    </tbody>
                </table>
                <p id="perf-no-data" class="text-center text-gray-400 py-8 hidden">No submissions found for this student.</p>
            </div>
        </div>
    </div>

<script>
    const TEACHER_EMAILS = ["klynch@mtps.us"];
    const firebaseConfig = {
      apiKey: "AIzaSyBnw3xU5aOSExv6dx7Kr-k2pvCXzn_1UyY",
      authDomain: "mrlynch-slides-app.firebaseapp.com",
      projectId: "mrlynch-slides-app",
      storageBucket: "mrlynch-slides-app.appspot.com",
      messagingSenderId: "223179627035",
      appId: "1:223179627035:web:ff0f538f3029d829c3f6be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Globals for performance modal
    let assignmentMap = {};
    let cachedSubmissions = {};
    let currentPerfStudentId = null;

    auth.onAuthStateChanged(user => {
        if (user && TEACHER_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase())) {
            document.getElementById('pageLoader').classList.add('hidden');
            document.getElementById('rosterContent').classList.remove('hidden');
            loadRoster();
            prefetchAssignments();
        } else {
            document.getElementById('loading-text').textContent = "Please sign in to continue.";
            document.getElementById('signInButtonContainer').classList.remove('hidden');
        }
    });

    function handleCredentialResponse(response) {
        const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
        auth.signInWithCredential(credential).catch(error => {
            console.error("Firebase sign-in error", error);
            document.getElementById('auth-error').innerText = "Firebase sign-in failed. Please try again.";
        });
    }

    async function prefetchAssignments() {
        try {
            const snapshot = await db.collection("assignments").get();
            assignmentMap = {};
            snapshot.forEach(doc => {
                const data = doc.data();
                assignmentMap[doc.id] = data.name || data.title || "Untitled";
            });
            console.log("Prefetched assignments:", Object.keys(assignmentMap).length);
        } catch (error) {
            console.error("Error prefetching assignments:", error);
        }
    }

    function loadRoster() {
        const rosterContainer = document.getElementById('rosterContainer');
        const loadingState = document.getElementById('loadingState');
        
        db.collection("students").onSnapshot(snapshot => {
            if (snapshot.empty) {
                loadingState.innerText = "No students found. Click '+ Add Student' to build your roster.";
                loadingState.classList.remove('hidden');
                rosterContainer.innerHTML = '';
                return;
            }
            
            loadingState.classList.add('hidden');
            const students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            const classData = {};
            students.forEach(student => {
                const className = student.class || 'Unassigned';
                if (!classData[className]) {
                    classData[className] = [];
                }
                classData[className].push(student);
            });

            renderRoster(classData);

        }, error => {
            console.error("Error fetching roster:", error);
            loadingState.innerText = "Error loading roster. See console for details.";
        });
    }

    function renderRoster(classData) {
        const rosterContainer = document.getElementById('rosterContainer');
        rosterContainer.innerHTML = '';
        const classNames = Object.keys(classData).sort();

        classNames.forEach(className => {
            const classCard = document.createElement('div');
            classCard.className = "bg-gray-800 rounded-lg p-6 shadow-lg";
            
            let studentListHTML = '';
            classData[className]
                .sort((a,b) => a.name.localeCompare(b.name))
                .forEach(student => {
                const lifetime = student.auraLifetime || 0;
                const balance = student.auraBalance || 0;
                studentListHTML += `
                    <li class="flex justify-between items-center py-2 border-b border-gray-700">
                        <div class="flex-1">
                            <p class="font-medium">
                                <span class="text-blue-400 hover:underline cursor-pointer" onclick='openStudentPerformance("${student.id}", "${student.name.replace(/'/g, "\\'").replace(/"/g, '&quot;')}", "${student.email.replace(/"/g, '&quot;')}", ${lifetime})'>${student.name}</span>
                            </p>
                            <p class="text-sm text-gray-400">${student.email}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right font-mono text-sm">
                                <span class="text-yellow-400" title="Spendable Balance">${balance}</span>
                                <span class="text-gray-500">/</span>
                                <span class="text-purple-400" title="Lifetime Aura">${lifetime} ✧</span>
                            </div>
                            <button onclick='openStudentModal(${JSON.stringify(student)})' class="text-blue-400 hover:text-blue-300 text-sm">Edit</button>
                            <button onclick="handleDeleteStudent('${student.id}', '${student.name}')" class="text-red-400 hover:text-red-300 text-sm">Delete</button>
                        </div>
                    </li>
                `;
            });

            classCard.innerHTML = `
                <h2 class="text-2xl font-bold text-yellow-400 mb-4">${className}</h2>
                <div class="text-xs text-gray-500 mb-2 flex justify-end pr-20">Balance / Lifetime</div>
                <ul class="space-y-2">${studentListHTML}</ul>
            `;
            rosterContainer.appendChild(classCard);
        });
    }

    const studentModal = document.getElementById('studentModal');
    const modalTitle = document.getElementById('modalTitle');
    function openStudentModal(student = null) {
        document.getElementById('studentId').value = '';
        document.getElementById('studentName').value = '';
        document.getElementById('studentEmail').value = '';
        document.getElementById('studentPasscode').value = '';
        document.getElementById('studentClass').value = '';
        document.getElementById('studentAuraLifetime').value = '0';
        document.getElementById('studentAuraBalance').value = '0';
        document.getElementById('modal-error').innerText = '';

        if (student) {
            modalTitle.innerText = "Edit Student";
            document.getElementById('studentId').value = student.id;
            document.getElementById('studentName').value = student.name;
            document.getElementById('studentEmail').value = student.email;
            document.getElementById('studentPasscode').value = student.passcode;
            document.getElementById('studentClass').value = student.class;
            // Populate Aura fields (default to 0 if not present)
            document.getElementById('studentAuraLifetime').value = student.auraLifetime || 0;
            document.getElementById('studentAuraBalance').value = student.auraBalance || 0;
        } else {
            modalTitle.innerText = "Add Student";
        }
        studentModal.classList.remove('hidden');
    }

    function closeStudentModal() { studentModal.classList.add('hidden'); }

    async function handleSaveStudent() {
        const id = document.getElementById('studentId').value;
        const student = {
            name: document.getElementById('studentName').value.trim(),
            email: document.getElementById('studentEmail').value.toLowerCase().trim(),
            passcode: parseInt(document.getElementById('studentPasscode').value.trim(), 10),
            class: document.getElementById('studentClass').value.trim(),
            // Include Aura values (default to 0 if empty/NaN)
            auraLifetime: parseFloat(document.getElementById('studentAuraLifetime').value) || 0,
            auraBalance: parseFloat(document.getElementById('studentAuraBalance').value) || 0
        };

        if (!student.name || !student.email || !student.passcode || !student.class) {
            document.getElementById('modal-error').innerText = "All fields are required.";
            return;
        }
        if (isNaN(student.passcode)) {
            document.getElementById('modal-error').innerText = "Passcode must be a number.";
            return;
        }

        try {
            if (id) {
                await db.collection("students").doc(id).update(student);
                showToast("Student updated successfully!", {color: 'green'});
            } else {
                await db.collection("students").add(student);
                showToast("Student added successfully!", {color: 'green'});
            }
            closeStudentModal();
        } catch (error) {
            console.error("Error saving student:", error);
            document.getElementById('modal-error').innerText = "Could not save student. See console for details.";
        }
    }

    async function handleDeleteStudent(id, name) {
        if (confirm(`Are you sure you want to delete ${name}? This action cannot be undone.`)) {
            try {
                await db.collection("students").doc(id).delete();
                showToast("Student deleted successfully.", {color: 'blue'});
            } catch (error) {
                console.error("Error deleting student:", error);
                showToast("Could not delete student.", {color: 'red'});
            }
        }
    }
    
    document.getElementById('signOutButton').onclick = () => { auth.signOut(); };

    // Student Performance Modal Functions
    async function openStudentPerformance(studentId, name, email, auraLifetime) {
        currentPerfStudentId = studentId;
        
        // Populate header
        document.getElementById('perf-student-name').textContent = name;
        document.getElementById('perf-student-email').textContent = email;
        document.getElementById('perf-student-lifetime').textContent = `Lifetime Aura: ${auraLifetime} ✧`;
        
        // Clear date filters
        document.getElementById('perf-date-start').value = '';
        document.getElementById('perf-date-end').value = '';
        
        // Show modal
        document.getElementById('student-performance-modal').classList.remove('hidden');
        
        // Check if submissions are already cached
        if (cachedSubmissions[studentId]) {
            renderPerformanceData(cachedSubmissions[studentId], email);
            return;
        }
        
        // Fetch submissions
        try {
            // Try fetching by studentId first
            let submissionsQuery = await db.collection("submissions")
                .where("studentId", "==", studentId)
                .get();
            
            let submissions = submissionsQuery.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            // Backward compatibility: if no results, try by studentEmail
            if (submissions.length === 0) {
                submissionsQuery = await db.collection("submissions")
                    .where("studentEmail", "==", email)
                    .get();
                submissions = submissionsQuery.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            }
            
            // Also fetch submissionStatus for aura information
            const statusQuery = await db.collection("submissionStatus")
                .where("studentEmail", "==", email)
                .get();
            
            const statusByAssignment = {};
            statusQuery.forEach(doc => {
                const data = doc.data();
                const assignmentId = data.assignmentId;
                const currentTimestamp = data.timestamp?.seconds;
                const existingTimestamp = statusByAssignment[assignmentId]?.timestamp?.seconds;
                
                if (!statusByAssignment[assignmentId] || 
                    (currentTimestamp !== undefined && existingTimestamp !== undefined && currentTimestamp > existingTimestamp) ||
                    (currentTimestamp !== undefined && existingTimestamp === undefined)) {
                    statusByAssignment[assignmentId] = data;
                }
            });
            
            // Group submissions by assignment
            const submissionsByAssignment = {};
            submissions.forEach(sub => {
                const assignmentId = sub.assignmentId;
                if (!submissionsByAssignment[assignmentId]) {
                    submissionsByAssignment[assignmentId] = [];
                }
                submissionsByAssignment[assignmentId].push(sub);
            });
            
            // Create aggregated performance data
            const performanceData = Object.keys(submissionsByAssignment).map(assignmentId => {
                const subs = submissionsByAssignment[assignmentId];
                
                // Calculate average score for this assignment
                const scores = subs.map(s => s.score || 0);
                const avgScore = scores.length > 0 
                    ? scores.reduce((a, b) => a + b, 0) / scores.length 
                    : 0;
                
                // Get latest timestamp
                const timestamps = subs
                    .map(s => s.timestamp?.seconds || 0)
                    .filter(t => t > 0);
                const latestTimestamp = timestamps.length > 0 
                    ? timestamps.reduce((max, current) => Math.max(max, current), 0)
                    : 0;
                
                // Get aura info from status
                const status = statusByAssignment[assignmentId];
                const auraAwarded = status?.auraAwarded || false;
                const auraAmount = status?.auraAmount || 0;
                
                return {
                    assignmentId,
                    assignmentName: assignmentMap[assignmentId] || "Unknown Assignment",
                    avgScore: avgScore.toFixed(1),
                    timestamp: latestTimestamp,
                    auraAwarded,
                    auraAmount,
                    submissionCount: subs.length
                };
            });
            
            // Cache the results
            cachedSubmissions[studentId] = performanceData;
            
            // Render the data
            renderPerformanceData(performanceData, email);
            
        } catch (error) {
            console.error("Error fetching performance data:", error);
            showToast("Error loading performance data. See console for details.", {color: 'red'});
            document.getElementById('perf-no-data').textContent = "Error loading submissions.";
            document.getElementById('perf-no-data').classList.remove('hidden');
        }
    }
    
    function renderPerformanceData(performanceData, email, startDate = null, endDate = null) {
        const tableBody = document.getElementById('perf-submissions-table');
        const noDataMsg = document.getElementById('perf-no-data');
        
        // Apply date filtering if specified
        let filteredData = performanceData;
        if (startDate || endDate) {
            const startTimestamp = startDate ? new Date(startDate).getTime() / 1000 : 0;
            const endTimestamp = endDate ? new Date(endDate).getTime() / 1000 : Infinity;
            
            filteredData = performanceData.filter(p => 
                p.timestamp >= startTimestamp && p.timestamp <= endTimestamp
            );
        }
        
        if (filteredData.length === 0) {
            tableBody.innerHTML = '';
            noDataMsg.classList.remove('hidden');
            
            // Reset summary cards
            document.getElementById('perf-avg-score').textContent = '--';
            document.getElementById('perf-assignments-completed').textContent = '0';
            document.getElementById('perf-total-aura').textContent = '0';
            return;
        }
        
        noDataMsg.classList.add('hidden');
        
        // Sort by timestamp descending (most recent first)
        filteredData.sort((a, b) => b.timestamp - a.timestamp);
        
        // Calculate summary statistics
        const scores = filteredData.map(p => parseFloat(p.avgScore));
        const avgScore = scores.length > 0 
            ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1)
            : 0;
        const assignmentsCompleted = filteredData.length;
        const totalAura = filteredData.reduce((sum, p) => sum + (p.auraAwarded ? p.auraAmount : 0), 0);
        
        // Update summary cards
        document.getElementById('perf-avg-score').textContent = avgScore + '%';
        document.getElementById('perf-assignments-completed').textContent = assignmentsCompleted;
        document.getElementById('perf-total-aura').textContent = totalAura.toFixed(1) + ' ✧';
        
        // Render table rows
        tableBody.innerHTML = filteredData.map(p => {
            const date = p.timestamp > 0 
                ? new Date(p.timestamp * 1000).toLocaleDateString()
                : 'N/A';
            
            const auraText = p.auraAwarded 
                ? `✅ ${p.auraAmount} ✧`
                : '—';
            
            return `
                <tr>
                    <td class="p-3 text-sm">${p.assignmentName}</td>
                    <td class="p-3 text-sm text-gray-400">${date}</td>
                    <td class="p-3 text-sm font-mono ${p.avgScore >= 90 ? 'text-green-400' : p.avgScore >= 70 ? 'text-yellow-400' : 'text-orange-400'}">${p.avgScore}%</td>
                    <td class="p-3 text-sm ${p.auraAwarded ? 'text-yellow-400' : 'text-gray-500'}">${auraText}</td>
                </tr>
            `;
        }).join('');
    }
    
    function filterPerformanceByDate() {
        const startDate = document.getElementById('perf-date-start').value;
        const endDate = document.getElementById('perf-date-end').value;
        
        if (currentPerfStudentId && cachedSubmissions[currentPerfStudentId]) {
            const email = document.getElementById('perf-student-email').textContent;
            renderPerformanceData(cachedSubmissions[currentPerfStudentId], email, startDate, endDate);
        }
    }
    
    function clearPerformanceFilter() {
        document.getElementById('perf-date-start').value = '';
        document.getElementById('perf-date-end').value = '';
        filterPerformanceByDate();
    }
    
    function closeStudentPerformance() {
        document.getElementById('student-performance-modal').classList.add('hidden');
        currentPerfStudentId = null;
    }
    
    // Close modal on ESC key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !document.getElementById('student-performance-modal').classList.contains('hidden')) {
            closeStudentPerformance();
        }
    });
    
    // Close modal on outside click
    document.getElementById('student-performance-modal').addEventListener('click', (e) => {
        if (e.target.id === 'student-performance-modal') {
            closeStudentPerformance();
        }
    });

    function showToast(message, options = {}) { const { color = 'default', duration = 3000 } = options; const wrapper = document.getElementById('toast-wrapper'); if (!wrapper) return; const toast = document.createElement('div'); toast.className = 'flex items-center justify-between p-4 rounded-lg shadow-lg text-white max-w-sm animate-fade-in-right'; const colors = { default: 'bg-gray-700', green: 'bg-green-600', red: 'bg-red-600', blue: 'bg-blue-600' }; toast.classList.add(colors[color] || colors['default']); const messageSpan = document.createElement('span'); messageSpan.textContent = message; toast.appendChild(messageSpan); const closeButton = document.createElement('button'); closeButton.innerHTML = '&times;'; closeButton.className = 'ml-4 text-2xl font-bold leading-none hover:text-gray-300 focus:outline-none'; let timeoutId = null; const dismiss = () => { if (timeoutId) clearTimeout(timeoutId); toast.classList.remove('animate-fade-in-right'); toast.classList.add('animate-fade-out-right'); toast.addEventListener('animationend', () => toast.remove()); }; closeButton.onclick = dismiss; toast.appendChild(closeButton); wrapper.appendChild(toast); timeoutId = setTimeout(dismiss, duration); }
</script>
