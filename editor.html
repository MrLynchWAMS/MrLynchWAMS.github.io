<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Editor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👩‍🚀</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
  <style>
    .hidden { display: none; }
    textarea { font-family: monospace; resize: vertical; }
    @keyframes fade-in-right { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fade-out-right { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
    .animate-fade-in-right { animation: fade-in-right 0.5s ease-out forwards; }
    .animate-fade-out-right { animation: fade-out-right 0.5s ease-in forwards; }
    .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
    #toast-wrapper { position: fixed; top: 1rem; right: 1rem; z-index: 50; display: flex; flex-direction: column; gap: 0.5rem; }
    .simple-disabled-notice { background: #fee2e2; color: #991b1b; padding: 0.5rem; border-radius: 0.375rem; margin-top: 0.5rem; }
    .dialog-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(31,41,55,0.85); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .dialog-box {
      background: #1f2937;
      color: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 6px 32px rgba(0,0,0,0.22);
      padding: 2rem 2rem 1.5rem 2rem;
      min-width: 320px;
      max-width: 96vw;
      z-index: 1001;
      text-align: center;
      animation: fade-in-right 0.35s;
    }
    .dialog-box h3 { color: #fde68a; }
    .dialog-box button { margin: 0 0.5rem; }
    /* Ensure reload button sits above image and is visible */
    .reload-img-btn { z-index: 50; opacity: 0.95; }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans">

  <div id="page-loader" class="flex flex-col items-center justify-center h-screen">
    <h1 class="text-4xl font-bold text-yellow-400 mb-4">Assignment Editor</h1>
    <p id="loading-text" class="text-lg text-gray-300">Initializing...</p>
    <div id="signInButtonContainer" class="hidden mt-8">
      <div id="g_id_onload" data-client_id="1032478689007-9gk70vsn7i58l6f0qn5sr8q78sne1al5.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
    </div>
    <p id="auth-error" class="text-red-500 mt-4"></p>
  </div>

  <div id="editorContent" class="hidden container mx-auto p-4 md:p-8">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
      <h1 id="assignmentTitle" class="text-3xl font-bold text-yellow-400"></h1>
      <div>
        <a href="./assignments.html" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">&larr; Back to Assignments</a>
        <button onclick="saveAssignment()" id="saveBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Save Assignment</button>
        <button id="signOutButton" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Sign Out</button>
      </div>
    </div>

    <div class="bg-gray-800 p-4 rounded-lg mb-6">
      <h2 class="text-xl font-semibold mb-2">Student Link</h2>
      <div class="flex gap-2">
        <input id="shareLink" type="text" readonly class="w-full p-2 bg-gray-700 border border-gray-600 rounded">
        <button onclick="copyShareLink()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-3 rounded-lg">Copy</button>
      </div>
    </div>

    <div id="deadline-section" class="bg-gray-800 rounded-lg mb-8 overflow-hidden">
      <div id="deadline-header" class="flex justify-between items-center p-6 cursor-pointer" onclick="toggleDeadlineSection()">
        <h2 class="text-2xl font-bold text-yellow-400">Class Start Times & Deadlines</h2>
        <span id="deadline-chevron" class="text-2xl transform transition-transform">▶</span>
      </div>
      <div id="deadline-content" class="collapsible-content px-6 pb-6">
        <p class="text-gray-400 mb-4">Set the official start time for each class period. Per-question deadlines are calculated in minutes after this time.</p>
        <div id="class-start-times" class="flex flex-wrap gap-4"></div>
        <div class="mt-4 border-t border-gray-700 pt-4 flex justify-end">
          <button onclick="saveTeacherDefaults()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg">Save These Times as My Defaults</button>
        </div>
      </div>
    </div>

    <div class="bg-gray-800 p-6 rounded-lg mb-8">
      <label for="postSubmissionRule" class="block text-2xl font-bold text-yellow-400 mb-2">Post-Submission Policy</label>
      <p class="text-gray-400 mb-4">Choose what happens after a student officially submits this assignment.</p>
      <select id="postSubmissionRule" class="w-full md:w-1/2 p-2 bg-gray-700 rounded border border-gray-600">
        <option value="open">Remain Open (Students can review and resubmit)</option>
        <option value="lock">Lock (Students can review but not edit)</option>
        <option value="hide">Lock & Hide (Students cannot see answers or scores)</option>
      </select>
    </div>

    <div id="slidesContainer" class="space-y-8"></div>
  </div>

  <template id="checkerTemplate">
    <div class="checker-widget">
      <div class="flex items-center justify-between mb-2">
        <label class="block font-semibold">Checker Function</label>
        <div class="flex items-center space-x-1 p-1 bg-gray-700 rounded-lg">
          <button class="mode-toggle-btn simple-mode-btn bg-indigo-600 text-white rounded-md px-3 py-1 text-sm font-semibold">Simple</button>
          <button class="mode-toggle-btn advanced-mode-btn bg-transparent text-gray-300 rounded-md px-3 py-1 text-sm font-semibold">Advanced</button>
        </div>
      </div>
      <div class="simple-mode-ui mt-2 p-3 bg-gray-700/50 border border-gray-600 rounded-lg space-y-4">
        <div class="grid grid-cols-2 gap-4 text-sm border-b border-gray-700 pb-4">
          <div>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" class="exclusive-scoring-toggle bg-gray-700 border-gray-600 rounded text-indigo-500 focus:ring-indigo-600">
              <span>Exclusive scoring (stop at first match)</span>
            </label>
          </div>
          <div class="flex items-center space-x-2">
            <label class="whitespace-nowrap">Numeric equality tolerance (±)</label>
            <input type="number" class="numeric-tolerance-input w-20 bg-gray-700 border border-gray-600 rounded-md p-1 text-center" value="0" min="0" step="any">
          </div>
        </div>
        <div class="rule-groups-container space-y-4"></div>
        <button class="add-rule-group-btn mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg text-sm">+ Add Rule Group</button>
        
        <div class="mt-4">
          <label class="block text-xs font-medium text-gray-500">Live Code Preview (read-only)</label>
          <pre class="bg-gray-900 text-white p-2 rounded-md text-xs overflow-x-auto h-32"><code class="live-code-preview"></code></pre>
        </div>

        <div class="mt-2 pt-2 border-t border-gray-700 space-y-2">
          <label class="block text-xs font-medium text-gray-400">Optional: Toast notification when this group matches is set per-group</label>
        </div>
      </div>

      <div class="advanced-mode-ui hidden">
        <textarea class="checker-textarea w-full h-64 p-2 bg-gray-700 rounded" placeholder="// Write your checker function here"></textarea>
        <div class="flex justify-between mt-2">
          <button class="convert-to-simple-btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded-md text-sm">
            Convert back to Simple
          </button>
          <button class="delete-advanced-btn bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded-md text-sm">
            Delete Advanced Code
          </button>
        </div>
      </div>

      <!-- Quick Test area moved out so it's available in BOTH modes -->
      <div class="universal-quick-test mt-2 pt-2 border-t border-gray-700 space-y-2">
        <label class="block text-xs font-medium text-gray-400">Quick Test</label>
        <div class="flex items-center space-x-2">
          <input type="text" class="quick-test-input w-full bg-gray-700 border border-gray-600 rounded-md p-1 text-sm" placeholder="Enter a sample answer...">
          <button class="quick-test-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded-md text-sm">Run</button>
          <span class="quick-test-result text-sm font-semibold text-gray-300"></span>
        </div>
      </div>

      <div class="simple-disabled-notice hidden">
        <b>Advanced code exists.</b> Delete advanced code to use Simple Mode.
      </div>

  </template>
  <div id="toast-wrapper"></div>
<script>
const TEACHER_EMAILS = ["klynch@mtps.us", "mstuart@mtps.us", "cfiori@mtps.us", "mlock@mtps.us", "cheine@mtps.us"];
const CLIENT_ID = "1032478689007-9gk70vsn7i58l6f0qn5sr8q78sne1al5.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/presentations.readonly";
const firebaseConfig = {
  apiKey: "AIzaSyBnw3xU5aOSExv6dx7Kr-k2pvCXzn_1UyY",
  authDomain: "mrlynch-slides-app.firebaseapp.com",
  projectId: "mrlynch-slides-app",
  storageBucket: "mrlynch-slides-app.appspot.com",
  messagingSenderId: "223179627035",
  appId: "1:223179627035:web:ff0f538f3029d829c3f6be"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let assignmentId = null;
let assignmentData = null;
let tokenClient;
let allClassNames = [];
let teacherDefaults = {};

auth.onAuthStateChanged(user => {
  if (user && TEACHER_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase())) {
    authorizeGapi();
  } else {
    document.getElementById('loading-text').textContent = "Please sign in to continue.";
    document.getElementById('signInButtonContainer').classList.remove('hidden');
  }
});

function handleCredentialResponse(response) {
  const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
  auth.signInWithCredential(credential).catch(error => {
    console.error("Firebase sign-in error", error);
    document.getElementById('auth-error').innerText = "Firebase sign-in failed. Please try again.";
  });
}

function authorizeGapi() {
  gapi.load('client', () => {
    gapi.client.load('https://slides.googleapis.com/$discovery/rest?version=v1').then(() => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            gapi.client.setToken(tokenResponse);
            loadAssignment();
          } else {
            document.getElementById('loading-text').textContent = "Could not get Google API authorization. Please try re-signing in.";
            document.getElementById('signInButtonContainer').classList.remove('hidden');
          }
        },
      });
      tokenClient.requestAccessToken({prompt: ''});
    });
  });
}

window.onload = function() {
  const urlParams = new URLSearchParams(window.location.search);
  assignmentId = urlParams.get('id');
  if (!assignmentId) {
    document.getElementById('loading-text').textContent = "Error: No assignment ID provided in the URL.";
    document.getElementById('signInButtonContainer').classList.add('hidden');
  }
};

async function loadAssignment() {
  if (!assignmentId) return;
  const loadingText = document.getElementById('loading-text');
  try {
    loadingText.textContent = "Loading assignment data...";
    const teacherDefaultsDoc = await db.collection("teachers").doc(auth.currentUser.email).get();
    if(teacherDefaultsDoc.exists) { teacherDefaults = teacherDefaultsDoc.data(); }
    const assignmentDoc = await db.collection("assignments").doc(assignmentId).get();
    if (!assignmentDoc.exists) { loadingText.textContent = "Error: Assignment not found."; return; }
    assignmentData = { id: assignmentDoc.id, ...assignmentDoc.data() };
    const studentSnapshot = await db.collection("students").get();
    const students = studentSnapshot.docs.map(doc => doc.data());
    allClassNames = [...new Set(students.map(s => String(s.class)))].sort();
    loadingText.textContent = "Fetching slide information from Google...";
    const response = await gapi.client.slides.presentations.get({ presentationId: assignmentData.presentationId });
    const slides = response.result.slides;
    if (!slides || slides.length === 0) { loadingText.textContent = "Error: No slides found in the presentation."; return; }
    assignmentData.slideIds = slides.map(slide => slide.objectId);
    document.getElementById('page-loader').classList.add('hidden');
    document.getElementById('editorContent').classList.remove('hidden');
    document.getElementById('assignmentTitle').textContent = `Editing: ${assignmentData.name}`;
    document.getElementById('shareLink').value = `https://custom.scienceclass.rocks/classroompicker.html?assignmentId=${assignmentId}`;
    document.getElementById('postSubmissionRule').value = assignmentData.postSubmissionRule || 'open';
    renderDeadlineUI();
    renderEditor();
  } catch (error) {
    console.error("Error loading assignment or slides:", error);
    const errorMessage = error.result?.error?.message || "An unknown error occurred.";
    loadingText.textContent = `Error: ${errorMessage}. Please ensure Slides API is enabled and the presentation is shared with you.`;
  }
}

function renderDeadlineUI() {
  const container = document.getElementById('class-start-times');
  container.innerHTML = '';
  const assignmentStartTimes = assignmentData.deadlinePolicy?.classStartTimes;
  const defaultStartTimes = teacherDefaults.classStartTimes;
  const hardcodedDefaults = { '1': '08:01', '2': '08:50', '5': '11:17', '7': '12:55', '8': '13:44' };
  allClassNames.forEach(className => {
    const value = assignmentStartTimes?.[className] || defaultStartTimes?.[className] || hardcodedDefaults[className] || '00:00';
    container.innerHTML += `<div><label for="start-time-${className}" class="block text-sm font-semibold">${className}</label><input type="time" id="start-time-${className}" value="${value}" class="p-2 bg-gray-700 border border-gray-600 rounded w-28"></div>`;
  });
}

function renderEditor() {
  const container = document.getElementById('slidesContainer');
  container.innerHTML = '';
  let slideIds = assignmentData.slideIds || [];
  let checkerFunctions = assignmentData.checkerFunctions || {};
  let checkerMeta = assignmentData.checkerMeta || {};
  let deadlinePolicy = assignmentData.deadlinePolicy || {};
  slideIds.forEach((slideId, index) => {
    const qNum = index + 1;
    const slidePolicy = deadlinePolicy[`q${qNum}`] || {};
    const editorBox = document.createElement('div');
    editorBox.className = "slide-editor-box grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-800 p-4 rounded-lg";
    editorBox.innerHTML = `
      <div>
        <h3 class="text-xl font-semibold mb-2">Slide ${qNum}</h3>
        <div class="relative">
          <img id="img-${slideId}" src="" class="w-full rounded border border-gray-700">
          <button id="reload-btn-${slideId}" title="Reload image" aria-label="Reload image" class="reload-img-btn hidden absolute top-2 right-2 bg-yellow-400 text-black py-1 px-2 rounded text-sm">Reload</button>
        </div>
      </div>
      <div id="checker-container-${qNum}"></div>
      <div class="mt-4 border-t border-gray-700 pt-4">
        <h4 class="font-semibold mb-2">Deadline & Late Policy</h4>
        <div class="grid grid-cols-3 gap-2 text-sm">
          <div>
            <label>Deadline (mins)</label>
            <input type="number" id="deadline-minutes-${index}" value="${slidePolicy.deadlineMinutes || 0}" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600">
          </div>
          <div>
            <label>Penalty Type</label>
            <select id="penalty-type-${index}" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600">
              <option value="none" ${!slidePolicy.penaltyType || slidePolicy.penaltyType === 'none' ? 'selected' : ''}>No penalty</option>
              <option value="deduction" ${slidePolicy.penaltyType === 'deduction' || slidePolicy.penaltyType === 'percent' || slidePolicy.penaltyType === 'percentage' ? 'selected' : ''}>Percent deduction</option>
              <option value="incremental" ${slidePolicy.penaltyType === 'incremental' || slidePolicy.penaltyType === 'points' || slidePolicy.penaltyType === 'per_minute' ? 'selected' : ''}>Points per minute</option>
              <option value="zero" ${slidePolicy.penaltyType === 'zero' ? 'selected' : ''}>Zero if late</option>
            </select>
          </div>
          <div>
            <label>Penalty Value</label>
            <input type="number" id="penalty-value-${index}" value="${slidePolicy.penaltyValue || 0}" class="w-full mt-1 p-2 bg-gray-700 rounded border border-gray-600">
          </div>
        </div>
      </div>
    `;
    const checkerTemplate = document.getElementById('checkerTemplate');
    const checkerFragment = checkerTemplate.content.cloneNode(true);
    const checkerWidgetDiv = checkerFragment.querySelector('.checker-widget');

    const funcName = `calc${qNum}`;
    const initialCode = checkerFunctions[funcName] || "";
    const initialMeta = checkerMeta[funcName] || null;

    CheckerWidget(checkerWidgetDiv, initialCode, initialMeta);
    editorBox.querySelector(`#checker-container-${qNum}`).appendChild(checkerWidgetDiv);
    container.appendChild(editorBox);

    const imgElement = document.getElementById(`img-${slideId}`);
    const reloadBtn = document.getElementById(`reload-btn-${slideId}`);
    const imageUrl = `https://docs.google.com/presentation/d/${assignmentData.presentationId}/export/png?id=${assignmentData.presentationId}&pageid=${slideId}`;

    loadImageWithRetries(imgElement, imageUrl, 2, reloadBtn);

    if (reloadBtn) {
      reloadBtn.addEventListener('click', () => {
        reloadBtn.classList.add('hidden');
        if (imgElement && imgElement.dataset) imgElement.dataset.isPlaceholder = 'false';
        loadImageWithRetries(imgElement, imageUrl, 2, reloadBtn);
      });
    }
  });
}

// Extract a structured config from the current Simple UI
function serializeSimpleConfig(container) {
  const isExclusive = container.querySelector('.exclusive-scoring-toggle')?.checked || false;
  const tolerance = parseFloat(container.querySelector('.numeric-tolerance-input')?.value) || 0;

  const groups = [];
  container.querySelectorAll('.rule-group').forEach(group => {
    const points = Number(group.querySelector('.rule-points')?.value) || 0;
    const groupConnector = group.querySelector('.group-connector')?.value || '&&';
    const toastMessage = group.querySelector('.rule-toast-message')?.value || '';
    const toastColor = group.querySelector('.rule-toast-color')?.value || 'default';

    const conditions = [];
    group.querySelectorAll('.condition-row').forEach(cond => {
      const type = cond.querySelector('.cond-type')?.value || 'text';
      const op = cond.querySelector('.cond-operator')?.value || 'contains';
      const valInput = cond.querySelector('.cond-value');
      const value = valInput ? valInput.value : '';

      const condConfig = { type, op, value };

      if (type === 'text') {
        const textBoolEl = cond.querySelector('.text-bool');
        if (textBoolEl) condConfig.textBool = textBoolEl.value || '||';
      } else if (type === 'number') {
        const pickModeEl = cond.querySelector('.number-pick-mode');
        const idxEl = cond.querySelector('.number-index');
        condConfig.pickMode = pickModeEl ? pickModeEl.value : 'first';
        condConfig.index = idxEl ? parseInt(idxEl.value || '1', 10) : 1;
      }

      conditions.push(condConfig);
    });

    groups.push({
      points,
      groupConnector,
      toastMessage,
      toastColor,
      conditions
    });
  });

  return { isExclusive, tolerance, groups };
}

// Build Simple UI from a structured config
function buildUIFromSimpleConfig(container, config) {
  const exclusiveToggle = container.querySelector('.exclusive-scoring-toggle');
  const toleranceInput = container.querySelector('.numeric-tolerance-input');
  const ruleGroupsContainer = container.querySelector('.rule-groups-container');

  if (exclusiveToggle) exclusiveToggle.checked = !!config.isExclusive;
  if (toleranceInput) toleranceInput.value = config.tolerance ?? 0;

  ruleGroupsContainer.innerHTML = '';

  (config.groups || []).forEach((g, idx) => {
    const groupEl = createRuleGroupElement(idx + 1);

    const pointsInput = groupEl.querySelector('.rule-points');
    const connectorSelect = groupEl.querySelector('.group-connector');
    const toastMessageInput = groupEl.querySelector('.rule-toast-message');
    const toastColorSelect = groupEl.querySelector('.rule-toast-color');

    if (pointsInput) pointsInput.value = g.points ?? 0;
    if (connectorSelect) connectorSelect.value = g.groupConnector || '&&';
    if (toastMessageInput) toastMessageInput.value = g.toastMessage || '';
    if (toastColorSelect) toastColorSelect.value = g.toastColor || 'default';

    const condContainer = groupEl.querySelector('.conditions-container');
    if (condContainer) {
      condContainer.innerHTML = '';
      (g.conditions || []).forEach(c => {
        const condEl = createConditionElement();
        const typeSelect = condEl.querySelector('.cond-type');
        const opSelect = condEl.querySelector('.cond-operator');

        if (typeSelect) typeSelect.value = c.type || 'text';
        typeSelect.dispatchEvent(new Event('change'));

        if (opSelect) opSelect.value = c.op || (c.type === 'number' ? '==' : 'contains');

        if (c.type === 'text') {
          const valueInput = condEl.querySelector('.cond-value');
          const textBoolEl = condEl.querySelector('.text-bool');
          if (valueInput) valueInput.value = c.value || '';
          if (textBoolEl && c.textBool) textBoolEl.value = c.textBool;
        } else if (c.type === 'number') {
          const valueInput = condEl.querySelector('.cond-value');
          const pickModeEl = condEl.querySelector('.number-pick-mode');
          const idxEl = condEl.querySelector('.number-index');
          if (valueInput) valueInput.value = c.value || '';
          if (pickModeEl && c.pickMode) pickModeEl.value = c.pickMode;
          if (idxEl && typeof c.index === 'number') {
            idxEl.value = String(c.index);
            if (c.pickMode === 'nth') {
              idxEl.classList.remove('hidden');
            } else {
              idxEl.classList.add('hidden');
            }
          }
        }

        condContainer.appendChild(condEl);
      });
    }

    ruleGroupsContainer.appendChild(groupEl);
  });

  if (!ruleGroupsContainer.children.length) {
    ruleGroupsContainer.appendChild(createRuleGroupElement(1));
  }
}

function CheckerWidget(container, initialCode = "", initialMeta = null) {
  let mode = "simple";
  let simpleDisabled = false;
  let code = initialCode || getDefaultCheckerCode();
  let advancedEdited = false;
  let initialAdvancedText = initialCode || "";
  let lastSavedSimpleConfig = initialMeta && initialMeta.simpleConfig
    ? initialMeta.simpleConfig
    : null;

  const simpleBtn = container.querySelector('.simple-mode-btn');
  const advBtn = container.querySelector('.advanced-mode-btn');
  const simpleUI = container.querySelector('.simple-mode-ui');
  const advUI = container.querySelector('.advanced-mode-ui');
  const ruleGroupsContainer = container.querySelector('.rule-groups-container');
  const livePreview = container.querySelector('.live-code-preview');
  const advTextarea = container.querySelector('.checker-textarea');
  const simpleDisabledNotice = container.querySelector('.simple-disabled-notice');
  const deleteAdvBtn = container.querySelector('.delete-advanced-btn');
  const convertToSimpleBtn = container.querySelector('.convert-to-simple-btn');

  const exclusiveToggle = container.querySelector('.exclusive-scoring-toggle');
  const toleranceInput = container.querySelector('.numeric-tolerance-input');
  const quickTestInput = container.querySelector('.quick-test-input');
  const quickTestBtn = container.querySelector('.quick-test-btn');
  const quickTestResult = container.querySelector('.quick-test-result');

  container.getCode = () => (mode === "simple" ? generateCodeFromUI(container) : advTextarea.value);
  container.getMode = () => mode;

  const hasInitialCode = !!initialCode && initialCode.trim().length > 0;
  const initialMode = initialMeta && initialMeta.mode ? initialMeta.mode : null;
  const initialSimpleConfig = initialMeta && initialMeta.simpleConfig ? initialMeta.simpleConfig : null;

  if (!hasInitialCode) {
    mode = "simple";
    simpleDisabled = false;
    advancedEdited = false;
    if (ruleGroupsContainer.children.length === 0) {
      ruleGroupsContainer.appendChild(createRuleGroupElement(1));
    }
    updateCodeFromSimple();
    showSimpleMode();
    simpleDisabledNotice.classList.add('hidden');
  } else if (initialMode === "simple") {
    mode = "simple";
    simpleDisabled = false;
    advancedEdited = false;

    if (initialSimpleConfig) {
      buildUIFromSimpleConfig(container, initialSimpleConfig);
      lastSavedSimpleConfig = initialSimpleConfig;
    } else {
      if (ruleGroupsContainer.children.length === 0) {
        ruleGroupsContainer.appendChild(createRuleGroupElement(1));
      }
    }

    updateCodeFromSimple();
    showSimpleMode();
    simpleDisabledNotice.classList.add('hidden');
  } else if (initialMode === "advanced") {
    mode = "advanced";
    simpleDisabled = true;
    advancedEdited = true;
    showAdvancedMode();
    advTextarea.value = initialCode;
    ruleGroupsContainer.innerHTML = "";
    simpleDisabledNotice.classList.remove('hidden');
  } else {
    if (hasInitialCode) {
      mode = "advanced";
      simpleDisabled = true;
      advancedEdited = true;
      showAdvancedMode();
      advTextarea.value = initialCode;
      ruleGroupsContainer.innerHTML = "";
      simpleDisabledNotice.classList.remove('hidden');
    } else {
      mode = "simple";
      simpleDisabled = false;
      advancedEdited = false;
      if (ruleGroupsContainer.children.length === 0) {
        ruleGroupsContainer.appendChild(createRuleGroupElement(1));
      }
      updateCodeFromSimple();
      showSimpleMode();
      simpleDisabledNotice.classList.add('hidden');
    }
  }

  simpleBtn.onclick = () => {
    if (simpleDisabled) {
      if (advancedEdited) {
        simpleDisabledNotice.classList.remove('hidden');
      }
      return;
    }
    mode = "simple";
    showSimpleMode();
    simpleDisabledNotice.classList.add('hidden');
    const generatedCode = generateCodeFromUI(container);
    livePreview.textContent = generatedCode;
    advTextarea.value = generatedCode;
    initialAdvancedText = generatedCode;
  };

  advBtn.onclick = () => {
    mode = "advanced";
    showAdvancedMode();
    if (!hasInitialCode || initialMode === "simple" || !advancedEdited) {
      const fromSimple = generateCodeFromUI(container);
      advTextarea.value = fromSimple;
      initialAdvancedText = fromSimple;
    }
  };

  advTextarea.oninput = () => {
    code = advTextarea.value;
    const trimmedNow = advTextarea.value.trim();
    const trimmedInitial = initialAdvancedText.trim();
    const actuallyChanged = trimmedNow !== trimmedInitial;

    if (actuallyChanged && !advancedEdited) {
      advancedEdited = true;
      simpleDisabled = true;
      simpleDisabledNotice.classList.remove('hidden');
    } else if (!actuallyChanged && advancedEdited) {
      advancedEdited = false;
      simpleDisabled = false;
      simpleDisabledNotice.classList.add('hidden');
    }
  };

  deleteAdvBtn.onclick = () => {
    showDialog(
      "Delete advanced code and switch to Simple Mode?",
      "This will discard your advanced changes and restore the simple editor.",
      () => {
        advTextarea.value = "";
        code = getDefaultCheckerCode();
        mode = "simple";
        advancedEdited = false;
        simpleDisabled = false;
        showSimpleMode();
        simpleDisabledNotice.classList.add('hidden');
        ruleGroupsContainer.innerHTML = "";
        ruleGroupsContainer.appendChild(createRuleGroupElement(1));
        updateCodeFromSimple();
      }
    );
  };

  if (convertToSimpleBtn) {
    convertToSimpleBtn.onclick = () => {
      if (!lastSavedSimpleConfig) {
        if (typeof showToast === "function") {
          showToast("No simple configuration found to convert.", { color: "red" });
        }
        return;
      }

      const temp = container.cloneNode(true);
      buildUIFromSimpleConfig(temp, lastSavedSimpleConfig);
      const expectedSimpleCode = generateCodeFromUI(temp);

      const currentTrimmed = advTextarea.value.trim();
      const expectedTrimmed = expectedSimpleCode.trim();
      const compatible = currentTrimmed === expectedTrimmed;

      const doConvert = () => {
        mode = "simple";
        simpleDisabled = false;
        advancedEdited = false;
        buildUIFromSimpleConfig(container, lastSavedSimpleConfig);
        updateCodeFromSimple();
        showSimpleMode();
        simpleDisabledNotice.classList.add('hidden');
      };

      if (!compatible) {
        showDialog(
          "Convert back to Simple?",
          "The current advanced code does not exactly match the last simple configuration. Converting back to Simple will discard any custom advanced edits.",
          doConvert
        );
      } else {
        doConvert();
      }
    };
  }

  container.querySelector('.add-rule-group-btn').onclick = () => {
    ruleGroupsContainer.appendChild(
      createRuleGroupElement(ruleGroupsContainer.children.length + 1)
    );
    updateCodeFromSimple();
  };

  ruleGroupsContainer.addEventListener('click', (e) => {
    const target = e.target;

    if (target.classList.contains('delete-group-btn')) {
      const group = target.closest('.rule-group');
      if (group) {
        group.remove();
        Array.from(ruleGroupsContainer.querySelectorAll('.rule-group')).forEach((g, idx) => {
          const title = g.querySelector('h4');
          if (title) title.textContent = `Rule Group ${idx + 1}`;
        });
        updateCodeFromSimple();
      }
      return;
    }

    if (target.classList.contains('add-condition-btn')) {
      const group = target.closest('.rule-group');
      if (group) {
        const conditionsContainer = group.querySelector('.conditions-container');
        if (conditionsContainer) {
          conditionsContainer.appendChild(createConditionElement());
          updateCodeFromSimple();
        }
      }
      return;
    }

    if (target.classList.contains('delete-btn')) {
      const row = target.closest('.condition-row');
      if (row) {
        row.remove();
        updateCodeFromSimple();
      }
      return;
    }
  });

  quickTestBtn.onclick = () => {
    const codeToTest = container.getCode();
    const testAnswerRaw = quickTestInput.value;
    quickTestResult.textContent = '';

    const frame = document.createElement('iframe');
    frame.style.display = 'none';
    frame.src = 'about:blank';
    document.body.appendChild(frame);

    try {
      const win = frame.contentWindow;
      const before = new Set(Object.getOwnPropertyNames(win));

      try {
        win.eval(codeToTest);
      } catch (evalErr) {
        quickTestResult.textContent = `Error evaluating code: ${evalErr.message}`;
        quickTestResult.style.color = '#f87171';
        document.body.removeChild(frame);
        return;
      }

      const afterProps = Object.getOwnPropertyNames(win);
      const newProps = afterProps.filter(p => !before.has(p));

      let funcNames = newProps.filter(name => {
        try { return typeof win[name] === 'function'; } catch (e) { return false; }
      });

      if (funcNames.length === 0) {
        const heuristics = ['checkAnswer','check','calc','validate','grade','score','match'];
        const allNames = afterProps;
        for (const name of allNames) {
          try {
            if (typeof win[name] === 'function') {
              for (const h of heuristics) {
                if (name.toLowerCase().startsWith(h.toLowerCase())) {
                  funcNames.push(name);
                  break;
                }
              }
            }
          } catch (e) {}
        }
      }

      if (funcNames.length === 0) {
        const blacklist = new Set(['Object','Math','Date','String','Number','Array','Promise','fetch','window','self','parent','frames','top','localStorage','sessionStorage','indexedDB','console']);
        const allNames = Object.getOwnPropertyNames(win);
        for (const name of allNames) {
          if (blacklist.has(name)) continue;
          try {
            if (typeof win[name] === 'function') {
              funcNames.push(name);
            }
          } catch (e) {}
        }
      }

      if (funcNames.length === 0) {
        quickTestResult.textContent = 'No callable function found in the provided code.';
        quickTestResult.style.color = '#f87171';
        document.body.removeChild(frame);
        return;
      }

      let chosenName = funcNames.find(n => n === 'checkAnswer') || funcNames[0];
      const fn = win[chosenName];

      const showToastShim = (...args) => { try { window.showToast && window.showToast(...args); } catch(e){} };
      const userProfileShim = { name: 'Test Student' };

      const variants = [];
      variants.push([testAnswerRaw]);
      variants.push([testAnswerRaw, showToastShim]);
      variants.push([testAnswerRaw, showToastShim, userProfileShim]);

      const maybeNum = parseFloat(testAnswerRaw);
      if (!isNaN(maybeNum)) {
        variants.push([maybeNum]);
        variants.push([maybeNum, showToastShim]);
        variants.push([maybeNum, showToastShim, userProfileShim]);
      }
      variants.push([]);

      let lastError = null;
      let called = false;
      let result;
      for (const args of variants) {
        try {
          result = fn.apply(win, args);
          called = true;
          break;
        } catch (callErr) {
          lastError = callErr;
        }
      }

      if (!called) {
        quickTestResult.textContent = `Error calling function '${chosenName}': ${lastError ? lastError.message : 'unknown error'}`;
        quickTestResult.style.color = '#f87171';
      } else {
        let out;
        try { out = typeof result === 'undefined' ? 'undefined' : JSON.stringify(result); } catch (e) { out = String(result); }
        quickTestResult.textContent = `Result: ${out}`;
        quickTestResult.style.color = '#d1d5db';
      }

    } finally {
      if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
    }
  };

  ruleGroupsContainer.addEventListener('change', updateCodeFromSimple);
  ruleGroupsContainer.addEventListener('keyup', updateCodeFromSimple);
  exclusiveToggle.addEventListener('change', updateCodeFromSimple);
  toleranceInput.addEventListener('input', updateCodeFromSimple);

  function showSimpleMode() {
    simpleUI.classList.remove('hidden');
    advUI.classList.add('hidden');
    simpleBtn.classList.add('bg-indigo-600', 'text-white');
    simpleBtn.classList.remove('bg-transparent', 'text-gray-300');
    advBtn.classList.add('bg-transparent', 'text-gray-300');
    advBtn.classList.remove('bg-indigo-600', 'text-white');
    livePreview.textContent = generateCodeFromUI(container);
    if (!advancedEdited) {
      advTextarea.value = generateCodeFromUI(container);
      initialAdvancedText = advTextarea.value;
    }
  }

  function showAdvancedMode() {
    simpleUI.classList.add('hidden');
    advUI.classList.remove('hidden');
    simpleBtn.classList.add('bg-transparent', 'text-gray-300');
    simpleBtn.classList.remove('bg-indigo-600', 'text-white');
    advBtn.classList.add('bg-indigo-600', 'text-white');
    advBtn.classList.remove('bg-transparent', 'text-gray-300');
  }

  function updateCodeFromSimple() {
    code = generateCodeFromUI(container);
    livePreview.textContent = code;
    if (!advancedEdited) {
      advTextarea.value = code;
      initialAdvancedText = code;
    }
  }
}

  const wrapper = document.getElementById('toast-wrapper');
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  const dialog = document.createElement('div');
  dialog.className = 'dialog-box';
  dialog.innerHTML = `
    <h3 class="text-xl font-bold mb-2">${title}</h3>
    <p class="mb-4 text-gray-300">${message}</p>
    <div class="flex justify-end gap-2">
      <button class="dialog-confirm bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-4 rounded">Delete</button>
      <button class="dialog-cancel bg-gray-600 hover:bg-gray-700 text-white font-bold py-1 px-4 rounded">Cancel</button>
    </div>

function generateCodeFromUI(container) {
  const isExclusive = container.querySelector('.exclusive-scoring-toggle').checked;
  const tolerance = parseFloat(container.querySelector('.numeric-tolerance-input').value) || 0;

  const ruleGroups = container.querySelectorAll('.rule-group');
  let code = `function checkAnswer(studentAnswer) {\n`;
  code += `    let score = 0;\n`;
  let totalMaxScore = 0;
  ruleGroups.forEach(group => { totalMaxScore += Number(group.querySelector('.rule-points').value) || 0; });
  code += `    const maxScore = ${totalMaxScore || 100};\n`;
  
  code += `    const answerStr = String(studentAnswer).toLowerCase();\n`;
  code += `    const numMatches = answerStr.match(/-?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?/g) || [];\n`;
  code += `    const answerNums = numMatches.map(s => parseFloat(s.replace(/,/g, '')));\n`;
  code += `    const answerNum = answerNums.length ? answerNums[0] : NaN; // Kept for backward compatibility\n`;

  if (tolerance > 0) {
    code += `\n    function isNear(a, b, t) {\n`;
    code += `        if (isNaN(a) || isNaN(b)) return false;\n`;
    code += `        return Math.abs(a - b) <= t;\n`;
    code += `    }\n`;
  }

  // Track whether we've written the first if statement (for exclusive scoring mode)
  let wroteIf = false;
  
  // Each Rule Group represents a single scoring rule with combined conditions.
  // Points are awarded once per group if the combined condition evaluates to true.
  ruleGroups.forEach((group) => {
    const points = Number(group.querySelector('.rule-points').value) || 0;
    const groupConnector = group.querySelector('.group-connector').value;
    const toastMessage = group.querySelector('.rule-toast-message')?.value.trim() || '';
    const toastColor = group.querySelector('.rule-toast-color')?.value || 'default';
    
    // Collect condition expressions for this group (to be combined with && or ||)
    let groupConditions = [];
    
    group.querySelectorAll('.condition-row').forEach(cond => {
      const type = cond.querySelector('.cond-type').value;
      const op = cond.querySelector('.cond-operator').value;
      const valInput = cond.querySelector('.cond-value');
      if (!valInput || valInput.value.trim() === "") return;
      
      const val = valInput.value.trim();

      if (type === 'text') {
        const keywords = val.split(',').map(k => k.trim().toLowerCase()).filter(Boolean);
        if (op === 'ordered') {
          if (keywords.length === 0) return;
          if (keywords.length === 1) {
            groupConditions.push(`answerStr.includes("${keywords[0].replace(/"/g, '\\"')}")`);
          } else {
            // Generate a pure boolean expression (IIFE that returns true/false) for ordered keyword check
            const kwsArrayLiteral = JSON.stringify(keywords);
            const orderedCheckExpr = `(function(){ const _kws = ${kwsArrayLiteral}; let _pos = 0; for (let _i = 0; _i < _kws.length; _i++){ const _p = answerStr.indexOf(_kws[_i], _pos); if (_p === -1) return false; _pos = _p + _kws[_i].length; } return true; })()`;
            groupConditions.push(orderedCheckExpr);
          }
        } else if (keywords.length > 1 && (op === 'contains' || op === 'not_contains')) {
          const textBool = cond.querySelector('.text-bool').value;
          const keywordConditions = keywords.map(k => `${op === 'not_contains' ? '!' : ''}answerStr.includes("${k.replace(/"/g, '\\"')}")`);
          groupConditions.push(`(${keywordConditions.join(` ${textBool} `)})`);
        } else if (keywords.length > 0) {
          const keyword = keywords[0];
          if (op === 'contains') groupConditions.push(`answerStr.includes("${keyword.replace(/"/g, '\\"')}")`);
          else if (op === 'not_contains') groupConditions.push(`!answerStr.includes("${keyword.replace(/"/g, '\\"')}")`);
          else if (op === 'equals_str') groupConditions.push(`answerStr === "${keyword.replace(/"/g, '\\"')}"`);
        }
      } else if (type === 'number') {
        const numericVal = parseFloat(val);
        if (isNaN(numericVal)) return;

        const pickMode = cond.querySelector('.number-pick-mode').value;
        const nthIndex = parseInt(cond.querySelector('.number-index').value, 10);

        const createComparison = (numVar) => {
          if (op === '==') {
            return tolerance > 0 ? `isNear(${numVar}, ${numericVal}, ${tolerance})` : `(${numVar} == ${numericVal})`;
          } else if (op === '!=') {
            return tolerance > 0 ? `!isNear(${numVar}, ${numericVal}, ${tolerance})` : `(${numVar} != ${numericVal})`;
          } else if (op === '>') {
            return `(${numVar} > ${numericVal})`;
          } else if (op === '<') {
            return `(${numVar} < ${numericVal})`;
          }
          return 'false';
        };

        let conditionString = 'false';
        switch (pickMode) {
          case 'first':
            conditionString = `(answerNums.length > 0 && ${createComparison('answerNums[0]')})`;
            break;
          case 'last':
            conditionString = `(answerNums.length > 0 && ${createComparison('answerNums[answerNums.length - 1]')})`;
            break;
          case 'nth':
            if (nthIndex > 0) {
              conditionString = `(answerNums.length >= ${nthIndex} && ${createComparison(`answerNums[${nthIndex - 1}]`)})`;
            }
            break;
          case 'any':
            conditionString = `(answerNums.some(num => ${createComparison('num')}))`;
            break;
        }
        groupConditions.push(conditionString);
      }
    });

    // Emit the group-level scoring logic if there are any conditions
    // Each group awards points exactly once if its combined condition is true
    if (groupConditions.length > 0) {
      let ifStatement = 'if';
      // In exclusive scoring mode, only the first matching group awards points (using if/else if chain)
      // In non-exclusive mode, all matching groups award points (using independent if statements)
      if (isExclusive) {
        ifStatement = wroteIf ? 'else if' : 'if';
        wroteIf = true;
      }
      
      code += `    ${ifStatement} (${groupConditions.join(` ${groupConnector} `)}) {\n`;
      code += `        score += ${points};\n`;
      if (toastMessage) {
        code += `        if (typeof showToast === "function") {\n`;
        code += `            try { showToast(${JSON.stringify(toastMessage)}, { color: ${JSON.stringify(toastColor)} }); } catch (_) {}\n`;
        code += `        }\n`;
      }
      code += `    }\n`;
    }
  });
  
  code += `    return score;\n`;
  code += `}`;
  return code;
}

function createConditionElement() {
  const div = document.createElement('div');
  div.className = 'condition-row flex items-center space-x-2 bg-gray-900/50 p-2 rounded-md';
  div.innerHTML = `
    <select class="cond-type bg-gray-700 border border-gray-600 rounded-md p-1 text-sm">
      <option value="text">Text</option>
      <option value="number">Number</option>
    </select>
    <select class="cond-operator bg-gray-700 border border-gray-600 rounded-md p-1 text-sm">
      <option value="contains">contains</option>
      <option value="not_contains">does not contain</option>
      <option value="equals_str">is exactly</option>
      <option value="ordered">contains in order</option>
    </select>
    <div class="cond-value-wrapper flex-grow">
      <input type="text" class="cond-value w-full bg-gray-700 border border-gray-600 rounded-md p-1 text-sm" placeholder="keyword(s), comma-separated">
      <div class="text-options hidden text-xs mt-1">
        <label>Require: </label>
        <select class="text-bool bg-gray-700 border border-gray-600 rounded-md p-0.5 text-sm">
          <option value="||">Any (OR)</option>
          <option value="&&">All (AND)</option>
        </select>
      </div>
    </div>
    <button class="delete-btn text-red-400 hover:text-red-300 font-bold text-xl leading-none">&times;</button>
  `;

  div.querySelector('.cond-type').addEventListener('change', e => {
    const operatorSelect = div.querySelector('.cond-operator');
    const valueWrapper = div.querySelector('.cond-value-wrapper');
    const type = e.target.value;
    
    if (type === 'number') {
      operatorSelect.innerHTML = `<option value="==">is equal to</option><option value="!=">is not equal to</option><option value=">">is greater than</option><option value="<">is less than</option>`;
      valueWrapper.innerHTML = `
        <div class="flex items-center space-x-1">
          <select class="number-pick-mode bg-gray-700 border border-gray-600 rounded-md p-1 text-sm">
            <option value="first">First</option>
            <option value="last">Last</option>
            <option value="nth">Nth</option>
            <option value="any">Any</option>
          </select>
          <input type="number" class="number-index w-12 bg-gray-700 border border-gray-600 rounded-md p-1 text-sm hidden" value="1" min="1" step="1">
          <span class="text-sm text-gray-400">number</span>
          <input type="number" class="cond-value w-full bg-gray-700 border border-gray-600 rounded-md p-1 text-sm" placeholder="a number" step="any">
        </div>
      `;
      valueWrapper.querySelector('.number-pick-mode').addEventListener('change', e_pick => {
        const indexInput = valueWrapper.querySelector('.number-index');
        if (e_pick.target.value === 'nth') {
          indexInput.classList.remove('hidden');
        } else {
          indexInput.classList.add('hidden');
        }
      });

    } else {
      operatorSelect.innerHTML = `<option value="contains">contains</option><option value="not_contains">does not contain</option><option value="equals_str">is exactly</option><option value="ordered">contains in order</option>`;
      valueWrapper.innerHTML = `
        <input type="text" class="cond-value w-full bg-gray-700 border border-gray-600 rounded-md p-1 text-sm" placeholder="keyword(s), comma-separated">
        <div class="text-options hidden text-xs mt-1">
          <label>Require: </label>
          <select class="text-bool bg-gray-700 border border-gray-600 rounded-md p-0.5 text-sm">
            <option value="||">Any (OR)</option>
            <option value="&&">All (AND)</option>
          </select>
        </div>
      `;
    }
  });

  div.querySelector('.cond-operator').addEventListener('change', e => {
    const type = div.querySelector('.cond-type').value;
    const operator = e.target.value;
    const textOptions = div.querySelector('.text-options');
    const valueInput = div.querySelector('.cond-value');
    if (type === 'text' && textOptions && valueInput) {
      if ((operator === 'contains' || operator === 'not_contains') && valueInput.value.includes(',')) {
        textOptions.classList.remove('hidden');
      } else {
        textOptions.classList.add('hidden');
      }
    }
  });

  div.addEventListener('keyup', e => {
    if (e.target.classList.contains('cond-value')) {
      const operator = div.querySelector('.cond-operator').value;
      const textOptions = div.querySelector('.text-options');
      if (!textOptions) return;
      if (operator === 'contains' || operator === 'not_contains') {
        if (e.target.value.includes(',')) textOptions.classList.remove('hidden');
        else textOptions.classList.add('hidden');
      } else {
        textOptions.classList.add('hidden');
      }
    }
  });
  return div;
}

async function saveAssignment() {
  const saveBtn = document.getElementById('saveBtn');
  try {
    saveBtn.textContent = "Saving...";
    const checkerFunctions = {};
    const checkerMeta = {};
    const deadlinePolicy = { classStartTimes: {} };

    allClassNames.forEach(className => {
      const timeValue = document.getElementById(`start-time-${className}`).value;
      if (timeValue) {
        deadlinePolicy.classStartTimes[String(className)] = timeValue;
      }
    });

    assignmentData.slideIds.forEach((id, index) => {
      const qNum = index + 1;
      const checkerWidgetDiv = document
        .getElementById(`checker-container-${qNum}`)
        .querySelector('.checker-widget');

      const funcName = `calc${qNum}`;
      const mode = checkerWidgetDiv.getMode();
      const code = checkerWidgetDiv.getCode();

      checkerFunctions[funcName] = code;

      const metaForThis = { mode };
      if (mode === "simple") {
        metaForThis.simpleConfig = serializeSimpleConfig(checkerWidgetDiv);
      }
      checkerMeta[funcName] = metaForThis;

      deadlinePolicy[`q${qNum}`] = {
        deadlineMinutes: parseInt(document.getElementById(`deadline-minutes-${index}`).value, 10) || 0,
        penaltyType: document.getElementById(`penalty-type-${index}`).value,
        penaltyValue: parseInt(document.getElementById(`penalty-value-${index}`).value, 10) || 0,
      };
    });

    const postSubmissionRule = document.getElementById('postSubmissionRule').value;
    await db.collection("assignments").doc(assignmentId).update({
      slideIds: assignmentData.slideIds,
      checkerFunctions: checkerFunctions,
      checkerMeta: checkerMeta,
      deadlinePolicy: deadlinePolicy,
      postSubmissionRule: postSubmissionRule
    });
    showToast("Assignment saved successfully!", { color: 'green' });
  } catch (error) {
    console.error("Error saving assignment:", error);
    showToast("Error saving. See console for details.", { color: 'red' });
  } finally {
    saveBtn.textContent = "Save Assignment";
  }
}

/*
  Enhanced image loader:
  - Accepts an optional reloadBtn element.
  - Hides reloadBtn while attempting loads.
  - Shows reloadBtn if all retries fail.
  - Keeps reload button visible when placeholder is shown (so user can retry).
  - Uses imgElement.dataset.isPlaceholder to detect placeholder load vs real load.
*/
function loadImageWithRetries(imgElement, srcUrl, maxRetries = 2, reloadBtn = null) {
  let attempt = 0;
  const placeholderUrl = 'https://placehold.co/400x300/374151/9ca3af?text=Image+Load+Failed';

  function setReloadVisible(visible) {
    try {
      if (!reloadBtn) return;
      if (visible) reloadBtn.classList.remove('hidden');
      else reloadBtn.classList.add('hidden');
    } catch (e) { /* ignore */ }
  }

  function cleanupHandlers() {
    imgElement.onload = null;
    imgElement.onerror = null;
  }

  function tryLoad() {
    imgElement.dataset.isPlaceholder = 'false';
    setReloadVisible(false);

    imgElement.onload = () => {
      if (imgElement.dataset && imgElement.dataset.isPlaceholder === 'true') {
        setReloadVisible(true);
      } else {
        setReloadVisible(false);
      }
      cleanupHandlers();
    };

    imgElement.onerror = () => {
      attempt++;
      if (attempt < maxRetries) {
        setTimeout(tryLoad, 1000);
      } else {
        console.error(`Could not load image after ${maxRetries} attempts: ${srcUrl}`);
        imgElement.dataset.isPlaceholder = 'true';
        imgElement.src = placeholderUrl;
        setReloadVisible(true);
        cleanupHandlers();
      }
    };

    const urlWithCacheBust = `${srcUrl}&time=${new Date().getTime()}`;
    imgElement.src = urlWithCacheBust;
  }

  tryLoad();
}

function copyShareLink() {
  const shareLinkInput = document.getElementById('shareLink');
  shareLinkInput.select();
  shareLinkInput.setSelectionRange(0, 99999);
  document.execCommand("copy");
  showToast("Link copied to clipboard!", { color: 'blue' });
}

function showToast(message, options = {}) {
  const wrapper = document.getElementById('toast-wrapper');
  const toast = document.createElement('div');
  let bg = 'bg-gray-800';
  if (options.color === 'green') bg = 'bg-green-600';
  else if (options.color === 'red') bg = 'bg-red-600';
  else if (options.color === 'blue') bg = 'bg-blue-600';

  toast.className = `${bg} text-white px-4 py-2 rounded shadow animate-fade-in-right`;
  toast.textContent = message;
  wrapper.appendChild(toast);
  setTimeout(() => {
    toast.classList.remove('animate-fade-in-right');
    toast.classList.add('animate-fade-out-right');
    setTimeout(() => toast.remove(), 500);
  }, options.duration || 3000);
}

function toggleDeadlineSection() {
  const content = document.getElementById('deadline-content');
  const chevron = document.getElementById('deadline-chevron');
  if (content.style.maxHeight && content.style.maxHeight !== '0px') {
    content.style.maxHeight = '0';
    chevron.style.transform = 'rotate(0deg)';
  } else {
    content.style.maxHeight = content.scrollHeight + 'px';
    chevron.style.transform = 'rotate(90deg)';
  }
}
