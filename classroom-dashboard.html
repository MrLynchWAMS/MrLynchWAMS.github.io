<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Overview Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <style>
        .hidden {
            display: none;
        }

        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #1f2937;
            z-index: 10;
        }

        .sticky-row {
            position: sticky;
            top: 0;
            background-color: #374151;
            z-index: 20;
        }

        .sticky-intersect {
            position: sticky;
            top: 0;
            left: 0;
            background-color: #374151;
            z-index: 30;
        }

        .grid-cell {
            transition: all 0.2s;
        }

        .grid-cell:hover {
            filter: brightness(1.2);
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans">

    <div id="pageLoader" class="flex flex-col items-center justify-center h-screen">
        <h1 class="text-4xl font-bold text-yellow-400 mb-4">Class Dashboard</h1>
        <p id="loading-text" class="text-lg text-gray-300">Initializing...</p>
        <div id="signInButtonContainer" class="hidden mt-8">
            <div id="g_id_onload"
                data-client_id="1032478689007-9gk70vsn7i58l6f0qn5sr8q78sne1al5.apps.googleusercontent.com"
                data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black"
                data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>
        <p id="auth-error" class="text-red-500 mt-4"></p>
    </div>

    <div id="dashboardContent" class="hidden h-screen flex flex-col p-4 md:p-8">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-bold text-yellow-400">Class Overview</h1>
                <select id="classSelector" onchange="handleClassChange()"
                    class="bg-gray-800 border border-gray-700 text-white rounded px-4 py-2 font-bold focus:ring-yellow-400">
                    <option value="">Select a Class...</option>
                </select>
            </div>
            <div class="flex gap-3">
                <a href="./assignments.html"
                    class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg text-sm">Assignments</a>
                <a href="./roster.html"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-sm">Roster</a>
                <button id="exportCsv"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg text-sm">Export
                    CSV</button>
                <button id="signOutButton"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg text-sm">Sign
                    Out</button>
            </div>
        </div>

        <div id="gridWrapper" class="flex-1 overflow-auto border border-gray-700 rounded-lg bg-gray-800 relative">
            <div id="noDataState" class="h-full flex items-center justify-center text-gray-400 italic">
                Select a class to view performance data.
            </div>
            <table id="performanceGrid" class="hidden min-w-full border-collapse">
                <thead id="gridHeader">
                    <!-- Dynamic -->
                </thead>
                <tbody id="gridBody">
                    <!-- Dynamic -->
                </tbody>
            </table>
        </div>

        <div class="mt-4 flex gap-6 text-xs text-gray-400">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-green-500 rounded"></div> Mastered (90%+)
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-yellow-500 rounded"></div> Proficient (70%+)
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-red-500 rounded"></div> Needs Support (<70%)< /div>
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 border border-gray-600 rounded"></div> Not Started
                    </div>
            </div>
        </div>

        <!-- Student Drilldown Modal -->
        <div id="drilldownModal"
            class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center p-4 border-b border-gray-700">
                    <div id="drilldownHeader">
                        <h2 id="ddStudentName" class="text-2xl font-bold text-yellow-400"></h2>
                        <p id="ddAssignmentName" class="text-sm text-gray-400"></p>
                    </div>
                    <button onclick="closeDrilldown()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
                </div>
                <div id="drilldownContent" class="p-6 overflow-y-auto space-y-4">
                    <!-- Question cards -->
                </div>
            </div>
        </div>

        <div id="toast-wrapper" class="fixed top-4 right-4 z-[100] space-y-3 w-full max-w-sm"></div>

        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyBnw3xU5aOSExv6dx7Kr-k2pvCXzn_1UyY",
                authDomain: "mrlynch-slides-app.firebaseapp.com",
                projectId: "mrlynch-slides-app",
                storageBucket: "mrlynch-slides-app.appspot.com",
                messagingSenderId: "223179627035",
                appId: "1:223179627035:web:ff0f538f3029d829c3f6be"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            const auth = firebase.auth();

            let currentUserEmail = null;
            let students = [];
            let assignments = [];
            let statuses = {};
            let currentClass = "";

            auth.onAuthStateChanged(async user => {
                if (user) {
                    try {
                        let emailToCheck = user.email.toLowerCase();
                        const impersonated = localStorage.getItem('impersonatedUserEmail');
                        if (impersonated) emailToCheck = impersonated;
                        currentUserEmail = emailToCheck;

                        document.getElementById('pageLoader').classList.add('hidden');
                        document.getElementById('dashboardContent').classList.remove('hidden');

                        loadData();
                    } catch (error) {
                        console.error("Auth error:", error);
                    }
                } else {
                    document.getElementById('signInButtonContainer').classList.remove('hidden');
                }
            });

            async function loadData() {
                const studentSnap = await db.collection("students").where("teacherEmail", "==", currentUserEmail).get();
                students = studentSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const ownedSnap = await db.collection("assignments").where("teacherEmail", "==", currentUserEmail).get();
                const coTaughtSnap = await db.collection("assignments").where("coTeachers", "array-contains", currentUserEmail).get();

                const assignmentMap = new Map();
                ownedSnap.forEach(doc => assignmentMap.set(doc.id, { id: doc.id, ...doc.data() }));
                coTaughtSnap.forEach(doc => assignmentMap.set(doc.id, { id: doc.id, ...doc.data() }));
                assignments = Array.from(assignmentMap.values()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                const classes = [...new Set(students.map(s => s.class))].filter(Boolean).sort();
                const selector = document.getElementById('classSelector');
                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    selector.appendChild(opt);
                });
                if (classes.length === 1) {
                    selector.value = classes[0];
                    handleClassChange();
                }
            }

            async function handleClassChange() {
                currentClass = document.getElementById('classSelector').value;
                if (!currentClass) {
                    document.getElementById('noDataState').classList.remove('hidden');
                    document.getElementById('performanceGrid').classList.add('hidden');
                    return;
                }
                document.getElementById('noDataState').innerHTML = `<div class="text-center">
                    <p class="text-xl mb-2">Analyzing class data...</p>
                    <div class="w-64 h-2 bg-gray-700 rounded-full mx-auto overflow-hidden">
                        <div class="h-full bg-yellow-400 animate-pulse"></div>
                    </div>
                </div>`;

                const classAssignments = assignments.filter(a => (a.assignedClasses || []).includes(currentClass));
                const classStudents = students.filter(s => s.class === currentClass);
                const studentEmails = new Set(classStudents.map(s => s.email.toLowerCase()));

                // 1. Fetch Submission Statuses (to know who "submitted")
                const statusSnap = await db.collection("submissionStatus")
                    .where("status", "==", "submitted")
                    .get();

                const statusMap = {};
                statusSnap.forEach(doc => {
                    const data = doc.data();
                    if (studentEmails.has(data.studentEmail.toLowerCase())) {
                        if (!statusMap[data.assignmentId]) statusMap[data.assignmentId] = {};
                        statusMap[data.assignmentId][data.studentEmail.toLowerCase()] = data;
                    }
                });

                // 2. Fetch ALL Submissions for these assignments to calculate scores
                statuses = {};

                for (const assignment of classAssignments) {
                    const subSnap = await db.collection("submissions")
                        .where("assignmentId", "==", assignment.id)
                        .get();

                    const assignmentScores = {};
                    const numQuestions = assignment.slideIds?.length || 1;

                    subSnap.forEach(doc => {
                        const sub = doc.data();
                        const email = sub.studentEmail.toLowerCase();
                        if (studentEmails.has(email)) {
                            if (!assignmentScores[email]) assignmentScores[email] = { slides: {} };
                            const idx = sub.slideIndex;
                            if (!assignmentScores[email].slides[idx] || sub.score > assignmentScores[email].slides[idx]) {
                                assignmentScores[email].slides[idx] = sub.score;
                            }
                        }
                    });

                    if (!statuses[assignment.id]) statuses[assignment.id] = {};

                    Object.keys(assignmentScores).forEach(email => {
                        let sum = 0;
                        Object.values(assignmentScores[email].slides).forEach(s => sum += s);
                        const finalScore = sum / numQuestions;

                        statuses[assignment.id][email] = {
                            score: finalScore,
                            isSubmitted: !!statusMap[assignment.id]?.[email]
                        };
                    });
                }
                renderGrid();
            }

            function renderGrid() {
                const grid = document.getElementById('performanceGrid');
                const header = document.getElementById('gridHeader');
                const body = document.getElementById('gridBody');
                const classStudents = students.filter(s => s.class === currentClass).sort((a, b) => a.name.localeCompare(b.name));
                const classAssignments = assignments.filter(a => (a.assignedClasses || []).includes(currentClass));

                if (classStudents.length === 0 || classAssignments.length === 0) {
                    document.getElementById('noDataState').innerHTML = "No students or assignments found for this class.";
                    document.getElementById('noDataState').classList.remove('hidden');
                    grid.classList.add('hidden');
                    return;
                }

                document.getElementById('noDataState').classList.add('hidden');
                grid.classList.remove('hidden');

                header.innerHTML = `
                <tr>
                    <th class="sticky-intersect p-4 text-left border-b border-r border-gray-700 w-64">Student Name</th>
                    ${classAssignments.map(a => `
                        <th class="sticky-row p-4 text-center border-b border-gray-700 min-w-[120px]">
                            <a href="./dashboard.html?assignmentId=${a.id}" class="text-xs hover:text-yellow-400 block" title="Go to Assignment Dashboard">${a.name}</a>
                        </th>
                    `).join('')}
                    <th class="sticky-row p-4 text-center border-b border-gray-700 bg-gray-900/50">Avg</th>
                </tr>
            `;

                body.innerHTML = classStudents.map(s => {
                    let totalScore = 0;
                    let count = 0;
                    const email = s.email.toLowerCase();
                    const cells = classAssignments.map(a => {
                        const status = statuses[a.id]?.[email];
                        const score = status?.score !== undefined ? status.score : null;
                        let colorClass = "text-gray-600";
                        let display = "-";
                        if (score !== null) {
                            totalScore += score;
                            count++;
                            display = Math.round(score) + "%";
                            colorClass = score >= 90 ? "bg-green-600/40 text-green-200" : (score >= 70 ? "bg-yellow-600/40 text-yellow-200" : "bg-red-600/40 text-red-200");
                        }
                        return `<td class="p-4 text-center border-b border-gray-700 grid-cell ${colorClass}" onclick="openDrilldown('${s.id}', '${a.id}')">${display}</td>`;
                    }).join('');
                    const avg = count > 0 ? Math.round(totalScore / count) + "%" : "-";
                    return `
                    <tr class="hover:bg-gray-700/50">
                        <td class="sticky-col p-4 border-b border-r border-gray-700 font-medium">${s.name}</td>
                        ${cells}
                        <td class="p-4 text-center border-b border-gray-700 font-bold bg-gray-900/30">${avg}</td>
                    </tr>
                `;
                }).join('');

                const avgRow = `
                <tr class="bg-gray-900/80 font-bold">
                    <td class="sticky-col p-4 border-r border-gray-700">Class Average</td>
                    ${classAssignments.map(a => {
                    let colTotal = 0;
                    let colCount = 0;
                    classStudents.forEach(s => {
                        const score = statuses[a.id]?.[s.email.toLowerCase()]?.score;
                        if (score !== undefined) {
                            colTotal += score;
                            colCount++;
                        }
                    });
                    const colAvg = colCount > 0 ? Math.round(colTotal / colCount) + "%" : "-";
                    return `<td class="p-4 text-center border-gray-700">${colAvg}</td>`;
                }).join('')}
                    <td class="p-4 text-center border-gray-700"></td>
                </tr>
            `;
                body.innerHTML += avgRow;
            }

            async function openDrilldown(studentId, assignmentId) {
                const student = students.find(s => s.id === studentId);
                const assignment = assignments.find(a => a.id === assignmentId);
                if (!student || !assignment) return;
                document.getElementById('ddStudentName').textContent = student.name;
                document.getElementById('ddAssignmentName').textContent = assignment.name;
                document.getElementById('drilldownContent').innerHTML = '<p class="text-center py-10 text-gray-500">Loading question details...</p>';
                document.getElementById('drilldownModal').classList.remove('hidden');
                try {
                    const subSnap = await db.collection("submissions")
                        .where("assignmentId", "==", assignmentId)
                        .where("studentEmail", "==", student.email.toLowerCase())
                        .get();
                    const subs = subSnap.docs.map(doc => doc.data());
                    const bestBySlide = {};
                    subs.forEach(sub => {
                        const idx = sub.slideIndex;
                        if (!bestBySlide[idx] || sub.score > bestBySlide[idx].score) {
                            bestBySlide[idx] = sub;
                        }
                    });
                    const numSlides = assignment.slideIds?.length || 1;
                    let html = "";
                    for (let i = 0; i < numSlides; i++) {
                        const sub = bestBySlide[i];
                        const score = sub ? Math.round(sub.score) : 0;
                        const color = sub ? (score >= 90 ? 'text-green-400' : (score >= 70 ? 'text-yellow-400' : 'text-red-400')) : 'text-gray-600';
                        const answer = sub ? sub.answer : "[No attempt]";
                        html += `
                        <div class="bg-gray-700 rounded-lg p-4 border border-gray-600">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-gray-300">Question ${i + 1}</span>
                                <span class="font-mono ${color}">${score}%</span>
                            </div>
                            <div class="bg-gray-900 rounded p-3 text-sm font-mono text-gray-400 italic">
                                ${answer}
                            </div>
                        </div>
                    `;
                    }
                    document.getElementById('drilldownContent').innerHTML = html;
                } catch (error) {
                    console.error("Drilldown error:", error);
                    document.getElementById('drilldownContent').innerHTML = '<p class="text-center py-10 text-red-400">Error loading details.</p>';
                }
            }

            function closeDrilldown() { document.getElementById('drilldownModal').classList.add('hidden'); }
            function handleCredentialResponse(response) {
                auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(response.credential));
            }
            document.getElementById('signOutButton').onclick = () => auth.signOut();
            document.getElementById('exportCsv').onclick = () => {
                if (!currentClass) return;
                const classStudents = students.filter(s => s.class === currentClass).sort((a, b) => a.name.localeCompare(b.name));
                const classAssignments = assignments.filter(a => (a.assignedClasses || []).includes(currentClass));
                let csv = "Student Name," + classAssignments.map(a => `"${a.name}"`).join(",") + ",Average\n";
                classStudents.forEach(s => {
                    let row = `"${s.name}",`;
                    let total = 0, count = 0;
                    classAssignments.forEach(a => {
                        const score = statuses[a.id]?.[s.email.toLowerCase()]?.score;
                        if (score !== undefined) {
                            row += `${Math.round(score)}%,`;
                            total += score;
                            count++;
                        } else {
                            row += "-,";
                        }
                    });
                    row += (count > 0 ? Math.round(total / count) + "%" : "-") + "\n";
                    csv += row;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Overview_${currentClass.replace(/\s+/g, '_')}.csv`;
                link.click();
            };
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrilldown(); });
        </script>
</body>

</html>
