<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const targetBase = "https://scienceclass.rocks";
    const fullPath = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(targetBase + fullPath);
  </script>
</head>
<body>
  <p>Redirecting to <a id="link" href="https://scienceclass.rocks">custom.scienceclass.rocks</a>...</p>
  <script>
    document.getElementById("link").href = targetBase + fullPath;
  </script>
</body>
</html>
