<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IterātED</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        .hidden { display: none; }
        textarea { resize: vertical; }
        .toast-wrapper { position: fixed; z-index: 100; padding: 1rem; width: 100%; max-width: 24rem; pointer-events: none; }
        .toast-wrapper>div { pointer-events: auto; }
        .top-left { top: 0; left: 0; }
        .top-center { top: 0; left: 50%; transform: translateX(-50%); }
        .top-right { top: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-center { bottom: 0; left: 50%; transform: translateX(-50%); }
        .bottom-right { bottom: 0; right: 0; }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fade-out-down { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
        .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
        .animate-fade-out-down { animation: fade-out-down 0.5s ease-in forwards; }
        #calculator-popup, #wordbank-popup { position: fixed; z-index: 1000; background: #1f2937; border: 1px solid #374151; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); user-select: none; display: none; flex-direction: column; overflow: hidden; min-width: 200px; }
        .popup-header { background: #111827; padding: 8px 12px; cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; }
        .popup-header span { font-size: 0.8rem; font-weight: bold; color: #9ca3af; }
        .popup-close { cursor: pointer; color: #ef4444; font-weight: bold; padding: 2px 6px; }
        #calculator-popup { width: 260px; }
        .calc-display { background: #111827; padding: 15px; text-align: right; font-family: monospace; border-bottom: 1px solid #374151; }
        #calc-history { font-size: 0.75rem; color: #6b7280; height: 1.2rem; overflow: hidden; }
        #calc-current { font-size: 1.5rem; color: #fff; margin-top: 4px; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #374151; }
        .calc-btn { background: #1f2937; border: none; color: #fff; padding: 15px; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
        .calc-btn:hover { background: #374151; }
        .calc-btn.op { background: #374151; color: #fbbf24; }
        .calc-btn.equals { background: #fbbf24; color: #000; font-weight: bold; }
        #wordbank-popup { width: 320px; max-height: 400px; }
        #video-wrapper.disable-seeking { position: relative; }
        #video-wrapper.disable-seeking::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: rgba(0,0,0,0.01); z-index: 10; cursor: not-allowed; pointer-events: auto; }
        #wordbank-popup { max-width: 300px; max-height: 400px; }
        .wordbank-body { padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; overflow-y: auto; }
        .word-item { background: #374151; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .word-item:hover { background: #4b5563; }
        .word-item.crossed-off { text-decoration: line-through; opacity: 0.4; background: #111827; }
        .tool-toggle-btn { position: fixed; right: 20px; z-index: 999; width: 45px; height: 45px; border-radius: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); transition: transform 0.2s; }
        .tool-toggle-btn:hover { transform: scale(1.1); background: #374151; }
        #calc-toggle-btn { bottom: 80px; }
        #wordbank-toggle-btn { bottom: 140px; }
        @media (max-width: 768px) { .tool-toggle-btn { width: 40px; height: 40px; font-size: 1rem; right: 10px; } #calc-toggle-btn { bottom: 70px; } #wordbank-toggle-btn { bottom: 120px; } }
        .pdf-student-page { position: relative; margin-bottom: 2rem; display: inline-block; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
        .pdf-student-canvas { display: block; max-width: 100%; height: auto; }
        .pdf-student-zone { position: absolute; border: 2px solid rgba(251, 191, 36, 0.7); background: rgba(255, 255, 255, 0.92); box-sizing: border-box; padding: 4px 6px; display: flex; flex-direction: column; transition: border-color 0.2s, box-shadow 0.2s; }
        .pdf-student-zone textarea { width: 100%; flex: 1; background: transparent; border: none; outline: none; resize: none; font-size: 14px; color: #1f2937; font-family: inherit; line-height: 1.4; }
        .pdf-student-zone .zone-q-label { font-size: 10px; font-weight: bold; color: #6b7280; line-height: 1; margin-bottom: 2px; flex-shrink: 0; }
        .pdf-student-zone.active { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35); }
        .pdf-student-zone.zone-correct { border-color: #22c55e; background: rgba(220, 252, 231, 0.92); }
        .pdf-student-zone.zone-partial { border-color: #f97316; background: rgba(255, 237, 213, 0.92); }
        .pdf-student-zone.zone-locked textarea { cursor: not-allowed; opacity: 0.6; }
        #pdf-check-panel { width: 220px; }
        .video-skip-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 48px; background: transparent; z-index: 10; cursor: not-allowed; display: none; }
        .disable-seeking .video-skip-overlay { display: block; }
        .blank-text-content h1, .blank-text-content h2, .blank-text-content h3 { color: #fbbf24; font-weight: 700; margin: 0.9rem 0 0.35rem; line-height: 1.2; }
        .blank-text-content h1 { font-size: 1.5rem; }
        .blank-text-content h2 { font-size: 1.25rem; }
        .blank-text-content h3 { font-size: 1.1rem; }
        .blank-text-content p { margin: 0.4rem 0; }
        .blank-text-content ul, .blank-text-content ol { margin: 0.5rem 0 0.5rem 1.25rem; padding-left: 1rem; }
        .blank-text-content ul { list-style: disc; }
        .blank-text-content ol { list-style: decimal; }
        .blank-text-content li { margin: 0.2rem 0; }
        .blank-text-content a { color: #60a5fa; text-decoration: underline; }
        .blank-text-content hr { border-color: #4b5563; margin: 1rem 0; }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
    <div class="container mx-auto p-4">
        <div id="pageLoader" class="text-center">
            <h1 class="text-3xl font-bold text-yellow-400">Loading Assignment...</h1>
            <p id="loadingError" class="text-red-500 mt-4"></p>
        </div>
        <!-- rest of file unchanged -->
    </div>
</body>
</html>
